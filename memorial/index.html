<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akbar Qamar Memorial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="memorial-root">
    <header class="memorial-header">
      <h1>Akbar Qamar Memorial</h1>
      <div class="controls">
        <button id="prev">◀</button>
        <button id="play">Play</button>
        <button id="next">▶</button>
        <button id="randomize">Random</button>
        <label class="opt">
          <input id="autoplayCheck" type="checkbox"> Autoplay
        </label>
      </div>
    </header>

    <main class="viewer">
      <div class="elapsed-time">
        <div class="time-display">
          <span id="years" class="time-val">0</span><span class="time-label">Y</span>
          <span id="months" class="time-val">0</span><span class="time-label">M</span>
          <span id="days" class="time-val">0</span><span class="time-label">D</span>
          <span id="hours" class="time-val">0</span><span class="time-label">H</span>
          <span id="minutes" class="time-val">0</span><span class="time-label">m</span>
        </div>
      </div>

      <div class="since-eol">
        <h2>EOL: 19 December 2025</h2>
        <div class="time-display">
          <span id="eol-years" class="time-val">0</span><span class="time-label">Y</span>
          <span id="eol-months" class="time-val">0</span><span class="time-label">M</span>
          <span id="eol-days" class="time-val">0</span><span class="time-label">D</span>
          <span id="eol-hours" class="time-val">0</span><span class="time-label">H</span>
          <span id="eol-minutes" class="time-val">0</span><span class="time-label">m</span>
        </div>
      </div>

      <div id="slideshow" class="slideshow">
        <img id="current" alt="Photo" src="" loading="lazy">
      </div>
      <div id="caption" class="caption"></div>
      <div id="thumbs" class="thumbs"></div>
    </main>

    <footer class="memorial-footer">
      <p class="years">December 8, 2001</p>
      <p class="note">EOL date: 19 December 2025</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
