<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Bulletin 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="viewer-app">
        <header class="viewer-header">
            <div>
                <p class="eyebrow">Research Bulletin</p>
                <h1>2026 Directors Cut</h1>
            </div>
            <div class="controls" aria-label="Viewer controls">
                <button id="prevButton" class="control-button" type="button">Previous</button>
                <button id="modeButton" class="control-button control-button--ghost" type="button">Spread View</button>
                <button id="nextButton" class="control-button" type="button">Next</button>
            </div>
        </header>

        <section class="status-bar" aria-live="polite">
            <div>
                <strong id="pageLabel">Loading PDF...</strong>
                <span id="modeLabel">Preparing viewer</span>
            </div>
            <label class="zoom-control" for="zoomSelect">
                <span>Zoom</span>
                <select id="zoomSelect">
                    <option value="fit" selected>Fit</option>
                    <option value="0.9">90%</option>
                    <option value="1">100%</option>
                    <option value="1.15">115%</option>
                    <option value="1.3">130%</option>
                </select>
            </label>
        </section>

        <section class="viewer-stage">
            <div class="book-frame">
                <div class="book-spine" aria-hidden="true"></div>

                <div id="spreadA" class="spread-layer is-active">
                    <article class="page-slot page-slot--left" data-slot="left">
                        <div class="page-shell">
                            <canvas aria-label="Left page"></canvas>
                            <p class="empty-state">Blank page</p>
                        </div>
                    </article>
                    <article class="page-slot page-slot--right" data-slot="right">
                        <div class="page-shell">
                            <canvas aria-label="Right page"></canvas>
                            <p class="empty-state">Blank page</p>
                        </div>
                    </article>
                </div>

                <div id="spreadB" class="spread-layer">
                    <article class="page-slot page-slot--left" data-slot="left">
                        <div class="page-shell">
                            <canvas aria-label="Left page"></canvas>
                            <p class="empty-state">Blank page</p>
                        </div>
                    </article>
                    <article class="page-slot page-slot--right" data-slot="right">
                        <div class="page-shell">
                            <canvas aria-label="Right page"></canvas>
                            <p class="empty-state">Blank page</p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./script.js"></script>
</body>
</html>
