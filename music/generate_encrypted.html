<!DOCTYPE html>
<html>
<head>
    <title>Generate Encrypted Titles</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .result { background: #2a2a2a; padding: 15px; border-left: 4px solid #FFB800; margin: 10px 0; }
        pre { background: #000; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Generate Encrypted Titles for Black Book</h1>
    <div id="results"></div>

    <script>
        const BLACK_BOOK_KEY = "darkbook2025";
        
        const originalTitles = [
            "I Don't Want to Wake Up",
            "You Die Twice", 
            "The Voices in My Head",
            "Mirror, Mirror",
            "Entropy's Lullaby",
            "Black Book",
            "Rewind Repeat",
            "My Favorite Lie Is Me",
            "Empty Room",
            "Cradle Song for the Damned",
            "Clock Without Hands",
            "Stockholm Syndrome",
            "Facade of Freewill",
            "Hug of Death",
            "Midnight Doomsday",
            "Leave Me to be",
            "Goodbye for the Last Time"
        ];

        function encryptTitle(title, key = BLACK_BOOK_KEY) {
            // XOR encrypt
            let encrypted = '';
            for (let i = 0; i < title.length; i++) {
                encrypted += String.fromCharCode(title.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            
            // Base64 encode
            return btoa(encrypted);
        }

        function decryptTitle(encryptedTitle, key = BLACK_BOOK_KEY) {
            try {
                const decoded = atob(encryptedTitle);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return 'Error: ' + e.message;
            }
        }

        let output = '<div class="result"><h3>Encrypted Titles JSON:</h3><pre>';
        
        originalTitles.forEach((title, index) => {
            const encrypted = encryptTitle(title);
            const trackNum = String(index + 1).padStart(2, '0');
            
            output += `        {
          "encryptedTitle": "${encrypted}",
          "obfuscatedTitle": "Track ${trackNum}",
          "artist": "Akbar Q",
          "description": "...",
          "file": "music/The Black Book/${trackNum}_encrypted.wav",
          "duration": null
        }${index < originalTitles.length - 1 ? ',' : ''}
`;
        });
        
        output += '</pre></div>';
        
        // Test decryption
        output += '<div class="result"><h3>Decryption Test:</h3>';
        originalTitles.forEach((title, index) => {
            const encrypted = encryptTitle(title);
            const decrypted = decryptTitle(encrypted);
            const success = decrypted === title;
            output += `<p style="color: ${success ? '#0f0' : '#f00'}">Track ${index + 1}: "${title}" → "${decrypted}" ${success ? '✓' : '✗'}</p>`;
        });
        output += '</div>';
        
        document.getElementById('results').innerHTML = output;
    </script>
</body>
</html>
