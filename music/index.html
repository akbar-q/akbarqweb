  <canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;"></canvas>
  <div class="container">
    <header>
      <h1>Music Collection</h1>
      <p class="header-subtitle">Explore electronic soundscapes and engineering-inspired compositions</p>
    </header>
    
    <main>
      <div id="loading-indicator" class="loading-indicator">
        <div class="loading-spinner"></div>
        <p>Loading music library...</p>
      </div>
      <div id="album-list" class="album-list" style="display: none;"></div>
      <div id="album-view" class="album-view" style="display:none;">
        <button id="back" class="back-btn">← Back</button>
        <img id="album-cover" class="album-cover" src="" alt="Album Cover"/>
        <div class="album-header">
          <div class="album-info">
            <h2 id="album-title"></h2>
          </div>
          <div class="album-controls">
            <button id="album-play" class="album-play-btn">▶ Play Album</button>
          </div>
        </div>
        
        <!-- Music Player Controls -->
        <div class="music-player-controls">
          <div class="now-playing-section">
            <span id="now-playing">Select a track to start playing</span>
          </div>
          <div class="player-controls">
            <button id="shuffle-btn" class="control-btn" title="Shuffle">🔀</button>
            <button id="prev-btn" class="control-btn" disabled>⏮</button>
            <button id="play-pause-btn" class="control-btn main-play-btn">▶</button>
            <button id="next-btn" class="control-btn" disabled>⏭</button>
            <button id="loop-btn" class="control-btn" title="Loop">🔁</button>
          </div>
          <div class="progress-section">
            <audio id="audio" preload="metadata"></audio>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-handle" id="progress-handle"></div>
            </div>
            <div class="time-display">
              <span id="current-time">0:00</span>
              <span id="total-time">0:00</span>
            </div>
          </div>
        </div>
        <table id="song-table" class="song-table">
          <thead id="song-table-head">
            <tr>
              <th>#</th>
              <th>Title</th>
              <th class="desktop-only">Artist</th>
              <th class="desktop-only">Description</th>
              <th>Duration</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="song-list"></tbody>
        </table>
        <div class="player-bar" style="display: none;">
          <!-- Hidden old player bar - functionality moved above -->
        </div>
      </div>
