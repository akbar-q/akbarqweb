<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Albums</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;"></canvas>
  <div class="container">
    <header class="music-header">
      <div class="music-header-inner">
        <div class="music-header-left">
          <img src="images/logospin.gif" alt="Logo" class="music-logo">
        </div>
        <span class="music-header-text">We Love Music</span>
        <div class="music-header-right">
          <a href="https://www.akbarq.com" class="music-home-btn">Home</a>
        </div>
      </div>
    </header>
    <main>
      <div id="album-list" class="album-list"></div>
      <div id="album-view" class="album-view" style="display:none;">
        <button id="back" class="back-btn">← Back</button>
        <img id="album-cover" class="album-cover" src="" alt="Album Cover"/>
        <div class="album-header">
          <h2 id="album-title"></h2>
          <button id="album-play" class="album-play-btn">▶ Play</button>
        </div>
        <table id="song-table" class="song-table">
          <thead id="song-table-head">
            <tr>
              <th>#</th>
              <th>Title</th>
              <th class="desktop-only">Artist</th>
              <th class="desktop-only">Description</th>
              <th>Duration</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="song-list"></tbody>
        </table>
        <div class="player-bar">
          <span id="now-playing"></span>
          <audio id="audio" controls></audio>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
