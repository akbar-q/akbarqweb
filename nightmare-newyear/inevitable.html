<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inevitable - New Year</title>
  <style>
    body {
      background: #353b48;
      color: #fbc531;
      font-family: 'Bitter', serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: inevitable-bg 2s infinite alternate;
    }
    @keyframes inevitable-bg {
      0% { background: #353b48; }
      100% { background: #718093; }
    }
    h1 {
      font-size: 2.7em;
      text-shadow: 0 0 10px #fbc531, 0 0 20px #fff;
      animation: inevitable-title 1.2s infinite alternate;
    }
    @keyframes inevitable-title {
      0% { color: #fbc531; }
      50% { color: #fff; }
      100% { color: #fbc531; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.3em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.95;
      color: #fff;
      text-shadow: 0 0 8px #fbc531;
    }
    .inevitable {
      font-size: 1.5em;
      color: #fbc531;
      opacity: 0.7;
      margin-top: 2em;
      animation: inevitable-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Inevitable</h1>
  <div class="poem">Death is inevitable, but not cruel.<br>It is the right of all living.<br>Time brings the end as a gift.<br><br>Accept it. It is yours to claim.</div>
  <div class="inevitable" id="inevitable"></div>
  <script>
    const inevitableLines = [
      "The end is a gift.",
      "You are allowed to accept it.",
      "It is not cruel, only true.",
      "You have earned your peace.",
      "Claim what is yours."
    ];
    let idx = 0;
    function showInevitable() {
      document.getElementById('inevitable').textContent = inevitableLines[idx];
      idx = (idx + 1) % inevitableLines.length;
      setTimeout(showInevitable, 2500 + Math.random()*1500);
    }
    showInevitable();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
