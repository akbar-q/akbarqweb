<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plea - New Year</title>
  <style>
    body {
      background: #232323;
      color: #ff6f61;
      font-family: 'Roboto Mono', monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: plea-bg 2s infinite alternate;
    }
    @keyframes plea-bg {
      0% { background: #232323; }
      100% { background: #3a3a3a; }
    }
    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #ff6f61, 0 0 20px #fff;
      animation: plea-title 1.2s infinite alternate;
    }
    @keyframes plea-title {
      0% { color: #ff6f61; }
      50% { color: #fff; }
      100% { color: #ff6f61; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.2em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.9;
      color: #fff;
      text-shadow: 0 0 8px #ff6f61;
    }
    .cry {
      font-size: 1.5em;
      color: #ff6f61;
      opacity: 0.7;
      margin-top: 2em;
      animation: plea-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Silent Plea</h1>
  <div class="poem">I asked for help, but the clock kept ticking.<br>My voice is lost in the noise of celebration.<br>Does anyone hear me?<br><br>Or am I just another echo in the new year?</div>
  <div class="cry" id="cry"></div>
  <script>
    const cries = [
      "Can you hear me?",
      "I am not okay.",
      "The noise drowns my plea.",
      "You could have helped.",
      "You are not innocent."
    ];
    let idx = 0;
    function showCry() {
      document.getElementById('cry').textContent = cries[idx];
      idx = (idx + 1) % cries.length;
      setTimeout(showCry, 2500 + Math.random()*1500);
    }
    showCry();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
