<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Echoes - New Year</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e94560;
      font-family: 'Fira Mono', monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: bgpulse 2s infinite alternate;
    }
    @keyframes bgpulse {
      0% { background: #1a1a2e; }
      100% { background: #0f3460; }
    }
    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #e94560, 0 0 20px #fff;
      animation: echo 1.2s infinite alternate;
    }
    @keyframes echo {
      0% { color: #e94560; }
      50% { color: #fff; }
      100% { color: #e94560; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.2em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.9;
      color: #fff;
      text-shadow: 0 0 8px #e94560;
    }
    .echo {
      font-size: 1.5em;
      color: #e94560;
      opacity: 0.7;
      margin-top: 2em;
      animation: echo 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Echoes of Regret</h1>
  <div class="poem">The new year echoes with regret.<br>Every wish returns, distorted.<br>Time repeats, but never forgives.<br>Listen. The silence is not empty.<br><br>It is full of what you left behind.</div>
  <div class="echo" id="echo"></div>
  <script>
    const echoes = [
      "Did you forget something?",
      "The past is not gone.",
      "You are not alone in the echo.",
      "Regret is a shadow that grows.",
      "The silence is speaking to you."
    ];
    let idx = 0;
    function showEcho() {
      document.getElementById('echo').textContent = echoes[idx];
      idx = (idx + 1) % echoes.length;
      setTimeout(showEcho, 2500 + Math.random()*1500);
    }
    showEcho();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
