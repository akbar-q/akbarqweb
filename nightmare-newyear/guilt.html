<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guilt - New Year</title>
  <style>
    body {
      background: #1b262c;
      color: #ffd6e0;
      font-family: 'Source Code Pro', monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: guilt-bg 2s infinite alternate;
    }
    @keyframes guilt-bg {
      0% { background: #1b262c; }
      100% { background: #222831; }
    }
    h1 {
      font-size: 2.7em;
      text-shadow: 0 0 10px #ffd6e0, 0 0 20px #fff;
      animation: guilt-title 1.2s infinite alternate;
    }
    @keyframes guilt-title {
      0% { color: #ffd6e0; }
      50% { color: #fff; }
      100% { color: #ffd6e0; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.3em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.95;
      color: #fff;
      text-shadow: 0 0 8px #ffd6e0;
    }
    .guilt {
      font-size: 1.5em;
      color: #ffd6e0;
      opacity: 0.7;
      margin-top: 2em;
      animation: guilt-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Guilt</h1>
  <div class="poem">You celebrate, but you forget.<br>There are voices you ignore.<br>Every cheer is a weight.<br>Every wish is a wound.<br><br>Did you reach out, or did you turn away?</div>
  <div class="guilt" id="guilt"></div>
  <script>
    const guiltLines = [
      "You could have done more.",
      "You looked away.",
      "You are part of the silence.",
      "The wounds are yours too.",
      "You are not blameless."
    ];
    let idx = 0;
    function showGuilt() {
      document.getElementById('guilt').textContent = guiltLines[idx];
      idx = (idx + 1) % guiltLines.length;
      setTimeout(showGuilt, 2500 + Math.random()*1500);
    }
    showGuilt();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
