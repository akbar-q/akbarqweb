<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alone - New Year</title>
  <style>
    body {
      background: #222f3e;
      color: #00b894;
      font-family: 'Space Mono', monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: alone-bg 2s infinite alternate;
    }
    @keyframes alone-bg {
      0% { background: #222f3e; }
      100% { background: #636e72; }
    }
    h1 {
      font-size: 2.6em;
      text-shadow: 0 0 10px #00b894, 0 0 20px #fff;
      animation: alone-title 1.2s infinite alternate;
    }
    @keyframes alone-title {
      0% { color: #00b894; }
      50% { color: #fff; }
      100% { color: #00b894; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.2em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.9;
      color: #fff;
      text-shadow: 0 0 8px #00b894;
    }
    .alone {
      font-size: 1.5em;
      color: #00b894;
      opacity: 0.7;
      margin-top: 2em;
      animation: alone-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Alone</h1>
  <div class="poem">The crowd is loud, but I am alone.<br>Every cheer is a reminder.<br>Every wish is a wall.<br><br>Did you notice me, or did you walk away?</div>
  <div class="alone" id="alone"></div>
  <script>
    const aloneLines = [
      "I am invisible.",
      "You never asked.",
      "You never saw me.",
      "You are not here for me.",
      "You could have reached out."
    ];
    let idx = 0;
    function showAlone() {
      document.getElementById('alone').textContent = aloneLines[idx];
      idx = (idx + 1) % aloneLines.length;
      setTimeout(showAlone, 2500 + Math.random()*1500);
    }
    showAlone();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
