<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Right - New Year</title>
  <style>
    body {
      background: #1e272e;
      color: #f5cd79;
      font-family: 'PT Serif', serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: right-bg 2s infinite alternate;
    }
    @keyframes right-bg {
      0% { background: #1e272e; }
      100% { background: #485460; }
    }
    h1 {
      font-size: 2.7em;
      text-shadow: 0 0 10px #f5cd79, 0 0 20px #fff;
      animation: right-title 1.2s infinite alternate;
    }
    @keyframes right-title {
      0% { color: #f5cd79; }
      50% { color: #fff; }
      100% { color: #f5cd79; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.3em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.95;
      color: #fff;
      text-shadow: 0 0 8px #f5cd79;
    }
    .right {
      font-size: 1.5em;
      color: #f5cd79;
      opacity: 0.7;
      margin-top: 2em;
      animation: right-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Right</h1>
  <div class="poem">Death is a right, not a punishment.<br>To choose the end is to claim freedom.<br>Time cannot deny you.<br><br>Rest is not forbidden. It is yours.</div>
  <div class="right" id="right"></div>
  <script>
    const rightLines = [
      "Freedom is in the choice.",
      "You are not a prisoner.",
      "Rest is not a crime.",
      "You are allowed to let go.",
      "The right to end is sacred."
    ];
    let idx = 0;
    function showRight() {
      document.getElementById('right').textContent = rightLines[idx];
      idx = (idx + 1) % rightLines.length;
      setTimeout(showRight, 2500 + Math.random()*1500);
    }
    showRight();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
