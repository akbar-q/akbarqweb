<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rest - New Year</title>
  <style>
    body {
      background: #222f3e;
      color: #00a8ff;
      font-family: 'Playfair Display', serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: rest-bg 2s infinite alternate;
    }
    @keyframes rest-bg {
      0% { background: #222f3e; }
      100% { background: #273c75; }
    }
    h1 {
      font-size: 2.6em;
      text-shadow: 0 0 10px #00a8ff, 0 0 20px #fff;
      animation: rest-title 1.2s infinite alternate;
    }
    @keyframes rest-title {
      0% { color: #00a8ff; }
      50% { color: #fff; }
      100% { color: #00a8ff; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.2em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.9;
      color: #fff;
      text-shadow: 0 0 8px #00a8ff;
    }
    .rest {
      font-size: 1.5em;
      color: #00a8ff;
      opacity: 0.7;
      margin-top: 2em;
      animation: rest-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Rest</h1>
  <div class="poem">Rest is not weakness.<br>It is the final kindness.<br>Death is a right, a return to peace.<br><br>Let go. You are allowed to rest.</div>
  <div class="rest" id="rest"></div>
  <script>
    const restLines = [
      "Peace is deserved.",
      "Rest is a right.",
      "You are allowed to stop.",
      "The end is gentle.",
      "You have earned your rest."
    ];
    let idx = 0;
    function showRest() {
      document.getElementById('rest').textContent = restLines[idx];
      idx = (idx + 1) % restLines.length;
      setTimeout(showRest, 2500 + Math.random()*1500);
    }
    showRest();
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
