<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmare New Year</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #e60000;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      animation: flicker 2s infinite alternate;
    }
    h1 {
      font-size: 3em;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px #e60000, 0 0 20px #000, 0 0 2px #fff;
      animation: glitch 1.5s infinite linear alternate-reverse;
    }
    @keyframes flicker {
      0% { opacity: 1; }
      10% { opacity: 0.8; }
      20% { opacity: 1; }
      30% { opacity: 0.7; }
      40% { opacity: 1; }
      50% { opacity: 0.9; }
      60% { opacity: 1; }
      70% { opacity: 0.6; }
      80% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { opacity: 1; }
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      20% { text-shadow: -2px 0 red, 2px 0 blue; }
      40% { text-shadow: 2px 2px #fff, -2px -2px #000; }
      60% { text-shadow: 0 0 10px #e60000, 0 0 20px #000; }
      80% { text-shadow: 2px -2px #fff, -2px 2px #000; }
      100% { text-shadow: 0 0 10px #e60000, 0 0 20px #000; }
    }
    .enter-btn {
      margin-top: 2em;
      padding: 1em 2em;
      font-size: 1.5em;
      background: #111;
      color: #e60000;
      border: 2px solid #e60000;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #e60000;
      transition: background 0.2s, color 0.2s;
      animation: flicker 1.2s infinite alternate;
    }
    .enter-btn:hover {
      background: #e60000;
      color: #111;
    }
    .static {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      opacity: 0.15;
      z-index: 10;
      background: url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif') repeat;
      mix-blend-mode: lighten;
    }
  </style>
</head>
<body>
  <div class="static"></div>
  <h1 id="mystery-title">00:00</h1>
  <div id="mystery-text" style="opacity:0.7; font-size:1.2em; max-width:70vw; text-align:center; margin-top:2em;"></div>
  <canvas id="rain" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5;"></canvas>
  <audio id="creepy-audio" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b1b1b1b1.mp3" preload="auto"></audio>
  <script>
    // Subtle time flicker
    setInterval(() => {
      const d = new Date();
      let h = d.getHours().toString().padStart(2,'0');
      let m = d.getMinutes().toString().padStart(2,'0');
      let s = d.getSeconds().toString().padStart(2,'0');
      document.getElementById('mystery-title').textContent = `${h}:${m}`;
      if (Math.random() < 0.1) document.getElementById('mystery-title').textContent = `${h}:${s}`;
    }, 900);

    // Mysterious text
    const texts = [
      "The clock strikes, but time is lost.",
      "Shadows gather where wishes rot.",
      "A year reborn, but nothing's new.",
      "You are not alone in this midnight.",
      "Every second is borrowed, every hope is hollow.",
      "The cycle never ends. The cycle never ends. The cycle never ends.",
      "Did you think you could escape?",
      "The bells ring, but no one listens.",
      "You are still here. Why?",
      "The new year devours the old, and you with it."
    ];
    let idx = 0;
    function showText() {
      document.getElementById('mystery-text').textContent = texts[idx];
      idx = (idx + 1) % texts.length;
      setTimeout(showText, 3500 + Math.random()*2000);
    }
    showText();

    // Rain of random letters
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=~'.split('');
    let fontSize = 22;
    let columns = Math.floor(W / fontSize);
    let drops = Array(columns).fill(1);
    function drawRain() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0,0,W,H);
      ctx.font = fontSize + "px monospace";
      for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillStyle = `rgba(230,0,0,${0.7+0.3*Math.random()})`;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > H && Math.random() > 0.975){
          drops[i]=0;
        }
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);
    window.addEventListener('resize',()=>{
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      columns = Math.floor(W / fontSize);
      drops = Array(columns).fill(1);
    });

    // Subtle audio
    setTimeout(()=>{
      document.getElementById('creepy-audio').play();
    }, 1200+Math.random()*1200);

    // Subtle auto-redirect to shuffle
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
