[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; You will upload the dashboard files into LittleFS.
; In PlatformIO: "Build Filesystem Image" then "Upload Filesystem Image".
board_build.filesystem = littlefs
