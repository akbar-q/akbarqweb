<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Financially Fluent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="mobile-container">
        <div class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <div style="color: var(--text-muted); font-size: 14px;">Welcome back</div>
                    <div style="color: var(--text-light); font-size: 24px; font-weight: 700;">Ahmed</div>
                </div>
                <div style="width: 40px; height: 40px; background: rgba(245, 158, 11, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                    🔔
                </div>
            </div>
            
            <div class="balance-card">
                <div class="balance-label">Current Balance</div>
                <div class="balance-amount">AED 12,450.75</div>
                
                <div class="income-expense">
                    <div class="income">
                        <div style="font-size: 16px; margin-bottom: 4px;">📈</div>
                        <div class="label">Income</div>
                        <div class="amount">+AED 8,500</div>
                    </div>
                    <div style="width: 1px; background: rgba(255, 255, 255, 0.2);"></div>
                    <div class="expense">
                        <div style="font-size: 16px; margin-bottom: 4px;">📉</div>
                        <div class="label">Expenses</div>
                        <div class="amount">-AED 5,280</div>
                    </div>
                </div>
            </div>
            
            <div class="insight-card">
                <div class="insight-title">
                    💡 AI Insight
                </div>
                <div class="insight-text">
                    You spent 35% more on dining out this month. Set a mission to save!
                </div>
                <button class="btn-secondary">Start Mission</button>
            </div>
            
            <div class="section-title">Spending Breakdown</div>
            <div class="card" style="text-align: center; padding: 40px 20px;" onclick="navigateToBreakdown()">
                <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                <div style="color: var(--text-light); font-weight: 500;">View detailed breakdown</div>
                <div style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Tap to see categories</div>
            </div>
        </div>
        
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📚</span>
                <span>Learn</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span>Missions</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🤖</span>
                <span>FinBot</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📱</span>
                <span>Simulator</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
