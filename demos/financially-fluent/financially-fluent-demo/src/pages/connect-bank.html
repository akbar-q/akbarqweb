<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Your Bank - Financially Fluent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="mobile-container">
        <div class="page">
            <div class="page-header">
                <h1 class="page-title">Connect Your Bank</h1>
                <p class="page-subtitle">Securely connect via Tarabut Gateway</p>
            </div>
            
            <div class="security-info">
                <div class="security-title">🛡️ Bank-Level Security</div>
                <div class="security-text">256-bit encryption • Read-only access</div>
            </div>
            
            <form id="bankConnectForm">
                <div class="form-group">
                    <label class="form-label">Bank Username</label>
                    <input type="text" class="form-input" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Enter your password" required>
                </div>
                
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 24px;">👁️</span>
                        <div>
                            <div style="color: var(--text-light); font-weight: 500;">We only read your transactions. We never have access to move your money.</div>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Connect Securely</button>
            </form>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        document.getElementById('bankConnectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            navigateToPermissions();
        });
    </script>
</body>
</html>
