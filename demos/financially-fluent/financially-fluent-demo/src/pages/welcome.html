<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Financially Fluent</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="welcome-splash">
    <div class="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="time">12:04</span>
            </div>
            <div class="status-right">
                <span class="battery">88%</span>
                <span class="signal">📶</span>
                <span class="wifi">📶</span>
            </div>
        </div>

        <!-- Welcome Animation Container -->
        <div class="welcome-animation">
            <!-- Animated Background -->
            <div class="welcome-bg-animation">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
            
            <!-- Main Content -->
            <div class="welcome-content">
                <div class="welcome-logo-container">
                    <div class="welcome-logo-wrapper">
                        <div class="welcome-logo-bg"></div>
                        <div class="welcome-logo" id="welcomeLogo">
                            <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                                <circle cx="50" cy="50" r="45" stroke="url(#welcomeGradient)" stroke-width="3" fill="none" class="logo-circle"/>
                                <path d="M30 50 L42 62 L70 34" stroke="url(#welcomeGradient)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="logo-check"/>
                                <defs>
                                    <linearGradient id="welcomeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#00ff88"/>
                                        <stop offset="50%" style="stop-color:#00d4ff"/>
                                        <stop offset="100%" style="stop-color:#8b5cf6"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <div class="welcome-logo-pulse"></div>
                    </div>
                </div>
                
                <div class="welcome-text-content">
                    <h1 class="welcome-title-main">
                        <span class="welcome-line">Welcome to</span>
                        <span class="welcome-line welcome-brand">Financially Fluent</span>
                    </h1>
                    
                    <p class="welcome-subtitle-main">
                        Your AI-powered financial companion is ready to help you master your money
                    </p>
                    
                    <div class="welcome-features">
                        <div class="welcome-feature" data-delay="0">
                            <div class="feature-icon-small">📊</div>
                            <span>Smart Analytics</span>
                        </div>
                        <div class="welcome-feature" data-delay="0.2">
                            <div class="feature-icon-small">🤖</div>
                            <span>AI Insights</span>
                        </div>
                        <div class="welcome-feature" data-delay="0.4">
                            <div class="feature-icon-small">🎯</div>
                            <span>Goal Tracking</span>
                        </div>
                    </div>
                </div>
                
                <div class="welcome-actions">
                    <button class="welcome-btn-primary" id="getStartedBtn" onclick="proceedToApp()">
                        <span>Let's Get Started</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    
                    <p class="welcome-subtext">
                        We'll guide you through setting up your financial dashboard
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function proceedToApp() {
            const btn = document.getElementById('getStartedBtn');
            btn.innerHTML = '<span>Loading your dashboard...</span>';
            btn.disabled = true;
            
            // Add success animation
            setTimeout(() => {
                btn.innerHTML = '<span>Ready! 🎉</span>';
                btn.style.background = 'var(--gradient-neon)';
                
                // Transition to home
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 500);
                }, 1000);
            }, 2000);
        }
        
        // Initialize welcome animations
        document.addEventListener('DOMContentLoaded', () => {
            // Animate features with stagger
            const features = document.querySelectorAll('.welcome-feature');
            features.forEach((feature, index) => {
                setTimeout(() => {
                    feature.classList.add('animate-in');
                }, 1000 + (index * 200));
            });
            
            // Auto-redirect after 5 seconds if no interaction
            setTimeout(() => {
                if (document.body.style.opacity !== '0') {
                    proceedToApp();
                }
            }, 8000);
        });
    </script>
    <script src="../js/app.js"></script>
</body>
</html>
