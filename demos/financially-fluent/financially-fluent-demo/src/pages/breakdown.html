<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Financially Fluent</tit            <a href="breakdown.html" class="nav-item active">
                <span class="nav-icon">📊</span>
                <span>Analytics</span>
            </a>    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="time">12:04</span>
            </div>
            <div class="status-right">
                <span class="battery">88%</span>
                <span class="signal">📶</span>
                <span class="wifi">📶</span>
            </div>
        </div>

        <div class="page">
            <!-- Header -->
            <div class="page-header-analytics">
                <button class="back-btn" onclick="history.back()">←</button>
                <h1 class="page-title">Analytics</h1>
                <button class="filter-btn">⚙️</button>
            </div>
            <!-- Time Period Selector -->
            <div class="period-selector">
                <button class="period-btn">7D</button>
                <button class="period-btn active">1M</button>
                <button class="period-btn">3M</button>
                <button class="period-btn">1Y</button>
            </div>

            <!-- Total Spending Card -->
            <div class="spending-summary-card">
                <div class="summary-header">
                    <div class="summary-label">Total Spending</div>
                    <div class="summary-period">This Month</div>
                </div>
                <div class="summary-amount" id="totalSpending">AED 5,280.00</div>
                <div class="summary-change">
                    <span class="change-icon">📈</span>
                    <span class="change-text">+12% from last month</span>
                </div>
            </div>

            <!-- Interactive Donut Chart -->
            <div class="chart-container">
                <div class="chart-wrapper">
                    <svg class="donut-chart" width="280" height="280" viewBox="0 0 280 280">
                        <!-- Background circle -->
                        <circle cx="140" cy="140" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20"/>
                        
                        <!-- Animated segments -->
                        <circle class="chart-segment dining" cx="140" cy="140" r="100" fill="none" 
                                stroke="#ff6b6b" stroke-width="20" stroke-linecap="round"
                                stroke-dasharray="0 628" transform="rotate(-90 140 140)"/>
                        <circle class="chart-segment shopping" cx="140" cy="140" r="100" fill="none" 
                                stroke="#4ecdc4" stroke-width="20" stroke-linecap="round"
                                stroke-dasharray="0 628" transform="rotate(-90 140 140)"/>
                        <circle class="chart-segment transport" cx="140" cy="140" r="100" fill="none" 
                                stroke="#45b7d1" stroke-width="20" stroke-linecap="round"
                                stroke-dasharray="0 628" transform="rotate(-90 140 140)"/>
                        <circle class="chart-segment bills" cx="140" cy="140" r="100" fill="none" 
                                stroke="#f9ca24" stroke-width="20" stroke-linecap="round"
                                stroke-dasharray="0 628" transform="rotate(-90 140 140)"/>
                        <circle class="chart-segment other" cx="140" cy="140" r="100" fill="none" 
                                stroke="#a55eea" stroke-width="20" stroke-linecap="round"
                                stroke-dasharray="0 628" transform="rotate(-90 140 140)"/>
                    </svg>
                    
                    <!-- Center info -->
                    <div class="chart-center">
                        <div class="center-amount" id="centerAmount">AED 5,280</div>
                        <div class="center-label">Total</div>
                    </div>
                </div>
            </div>
            <!-- Category Breakdown -->
            <div class="category-breakdown">
                <div class="breakdown-header">
                    <h3 class="breakdown-title">Spending by Category</h3>
                    <span class="view-toggle" onclick="toggleView()">📊</span>
                </div>

                <div class="category-list">
                    <div class="category-item active" data-category="dining" onclick="selectCategory(this)">
                        <div class="category-info">
                            <div class="category-color" style="background: #ff6b6b;"></div>
                            <div class="category-details">
                                <div class="category-name">Dining & Food</div>
                                <div class="category-transactions">24 transactions</div>
                            </div>
                        </div>
                        <div class="category-stats">
                            <div class="category-amount">AED 1,850</div>
                            <div class="category-percentage">35%</div>
                            <div class="category-change">+8%</div>
                        </div>
                    </div>

                    <div class="category-item" data-category="shopping">
                        <div class="category-info">
                            <div class="category-color" style="background: #4ecdc4;"></div>
                            <div class="category-details">
                                <div class="category-name">Shopping</div>
                                <div class="category-transactions">18 transactions</div>
                            </div>
                        </div>
                        <div class="category-stats">
                            <div class="category-amount">AED 1,320</div>
                            <div class="category-percentage">25%</div>
                            <div class="category-change">+12%</div>
                        </div>
                    </div>
                
                    <div class="category-item" data-category="transport">
                        <div class="category-info">
                            <div class="category-color" style="background: #10b981;"></div>
                            <div class="category-details">
                                <div class="category-name">Transport</div>
                                <div class="category-transactions">12 transactions</div>
                            </div>
                        </div>
                        <div class="category-stats">
                            <div class="category-amount">AED 950</div>
                            <div class="category-percentage">18%</div>
                            <div class="category-change">-3%</div>
                        </div>
                    </div>
                
                    <div class="category-item" data-category="bills">
                        <div class="category-info">
                            <div class="category-color" style="background: #f59e0b;"></div>
                            <div class="category-details">
                                <div class="category-name">Bills & Utilities</div>
                                <div class="category-transactions">8 transactions</div>
                            </div>
                        </div>
                        <div class="category-stats">
                            <div class="category-amount">AED 740</div>
                            <div class="category-percentage">14%</div>
                            <div class="category-change">+2%</div>
                        </div>
                    </div>
                
                    <div class="category-item" data-category="other">
                        <div class="category-info">
                            <div class="category-color" style="background: #8b5cf6;"></div>
                            <div class="category-details">
                                <div class="category-name">Other</div>
                                <div class="category-transactions">15 transactions</div>
                            </div>
                        </div>
                        <div class="category-stats">
                            <div class="category-amount">AED 420</div>
                            <div class="category-percentage">8%</div>
                            <div class="category-change">+5%</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section-title">Recent Transactions</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span style="color: var(--text-light); font-size: 18px; font-weight: 600;">Recent Transactions</span>
                <span style="color: var(--green); font-size: 14px; cursor: pointer;" onclick="navigateToTransactions()">See All</span>
            </div>
            
            <div class="transaction-item">
                <div class="transaction-icon" style="background: rgba(139, 69, 19, 0.2);">🍽️</div>
                <div class="transaction-details">
                    <div class="transaction-name">Zomato</div>
                </div>
                <div class="transaction-amount negative">AED 85.50</div>
            </div>
        </div>
        
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="breakdown.html" class="nav-item active">
                <span class="nav-icon">�</span>
                <span>Analytics</span>
            </a>
            <a href="transactions.html" class="nav-item">
                <span class="nav-icon">💳</span>
                <span>Transactions</span>
            </a>
            <a href="goals.html" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span>Goals</span>
            </a>
            <a href="financial-academy.html" class="nav-item">
                <span class="nav-icon">🎮</span>
                <span>Learn</span>
            </a>
        </nav>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        // Enhanced breakdown page functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Animate chart on load
            const chartPaths = document.querySelectorAll('.donut-chart path');
            chartPaths.forEach((path, index) => {
                setTimeout(() => {
                    path.style.opacity = '1';
                    path.style.strokeDasharray = path.getAttribute('data-dash');
                }, index * 200);
            });
            
            // Category interaction
            const categoryItems = document.querySelectorAll('.category-item');
            categoryItems.forEach(item => {
                item.addEventListener('click', function() {
                    // Remove active from all
                    categoryItems.forEach(cat => cat.classList.remove('active'));
                    // Add active to clicked
                    this.classList.add('active');
                    
                    // Highlight corresponding chart segment
                    const category = this.dataset.category;
                    chartPaths.forEach(path => {
                        if (path.dataset.category === category) {
                            path.style.filter = 'brightness(1.3) drop-shadow(0 0 10px currentColor)';
                        } else {
                            path.style.filter = 'brightness(0.7)';
                        }
                    });
                });
            });
            
            // Period selector functionality
            const periodBtns = document.querySelectorAll('.period-btn');
            periodBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    periodBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Animate data change
                    const totalSpending = document.getElementById('totalSpending');
                    totalSpending.style.opacity = '0.5';
                    setTimeout(() => {
                        totalSpending.style.opacity = '1';
                    }, 300);
                });
            });
        });
    </script>
</body>
</html>
