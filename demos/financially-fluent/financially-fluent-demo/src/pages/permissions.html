<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Permissions - Financially Fluent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="mobile-container">
        <div class="page">
            <div class="page-header">
                <h1 class="page-title">Grant Permissions</h1>
                <p class="page-subtitle">Review what Financially Fluent can access</p>
            </div>
            
            <div class="card">
                <div class="permission-item">
                    <div class="permission-icon" style="background: rgba(245, 158, 11, 0.2);">
                        👀
                    </div>
                    <div class="permission-details">
                        <h3>View Account Balance</h3>
                        <p>Check your current balance to provide insights</p>
                    </div>
                </div>
                
                <div class="permission-item">
                    <div class="permission-icon" style="background: rgba(16, 185, 129, 0.2);">
                        📊
                    </div>
                    <div class="permission-details">
                        <h3>Read Transaction History</h3>
                        <p>Analyze your spending patterns and habits</p>
                    </div>
                </div>
                
                <div class="permission-item">
                    <div class="permission-icon" style="background: rgba(59, 130, 246, 0.2);">
                        🔒
                    </div>
                    <div class="permission-details">
                        <h3>Read-Only Access</h3>
                        <p>We cannot move money or make transactions</p>
                    </div>
                </div>
            </div>
            
            <button class="btn-primary" onclick="navigateToHome()">Confirm & Continue</button>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
