<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #18181b;
      color: #f43f5e;
      font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }
    .texture-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.18;
      background: repeating-linear-gradient(135deg, #23272f 0 2px, transparent 2px 40px), repeating-linear-gradient(45deg, #f43f5e22 0 4px, transparent 4px 40px);
      animation: bgmove 12s linear infinite alternate;
    }
    @keyframes bgmove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 80px 80px, 40px 40px; }
    }
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 3.2em;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f43f5e;
      text-shadow: 0 2px 24px #fff1, 0 0 2px #fff, 0 0 8px #f43f5e44;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
      position: relative;
      animation: titlepop 1.8s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate;
    }
    @keyframes titlepop {
      0% { letter-spacing: 0.04em; transform: scale(1) rotate(-1deg); }
      100% { letter-spacing: 0.18em; transform: scale(1.04) rotate(2deg); }
    }
    .subtitle {
      font-size: 1.3em;
      color: #a1a1aa;
      margin-bottom: 1.2em;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      max-width: 60vw;
    }
    .intro {
      font-size: 1.1em;
      color: #f1f5f9;
      margin-bottom: 2.2em;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      background: rgba(24,24,27,0.7);
      border-radius: 1em;
      padding: 1.2em 2em;
      box-shadow: 0 2px 24px #f43f5e22;
    }
    .icon-row {
      display: flex;
      gap: 2.2em;
      margin-bottom: 2.5em;
      z-index: 2;
    }
    .icon-row svg {
      width: 3.2em;
      height: 3.2em;
      fill: #f43f5e;
      opacity: 0.82;
      filter: drop-shadow(0 0 8px #f43f5e44);
      transition: transform 0.18s, fill 0.18s, opacity 0.18s;
      cursor: pointer;
    }
    .icon-row svg:hover {
      transform: scale(1.18) rotate(-8deg);
      fill: #fff;
      opacity: 1;
    }
    .main-icon {
      position: absolute;
      top: 8vh;
      right: 8vw;
      width: 8em;
      height: 8em;
      opacity: 0.13;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px) drop-shadow(0 0 32px #f43f5e);
      animation: iconfloat 7s ease-in-out infinite alternate;
    }
    @keyframes iconfloat {
      0% { transform: scale(1) rotate(-8deg) translateY(0); }
      100% { transform: scale(1.08) rotate(12deg) translateY(18px); }
    }
  </style>
</head>
<body>
  <div class="texture-bg"></div>
  <div class="main-content">
    <h1 id="mystery-title">00:00</h1>
    <div class="subtitle">A Modern Cursed New Year</div>
    <div class="intro">
      Welcome to the loop. This is not a celebration, but a ritual.<br>
      Every second is borrowed, every hope is hollow.<br>
      <span style="color:#f43f5e;font-weight:bold;">You are not alone in this midnight.</span>
    </div>
    <div class="icon-row">
      <svg viewBox="0 0 24 24"><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm0-18c4.41 0 8 3.59 8 8s-3.59 8-8 8-8-3.59-8-8 3.59-8 8-8zm-1 13h2v2h-2zm0-8h2v6h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
    </div>
    <div id="code-leak" style="font-family:'Fira Mono',monospace;font-size:1.1em;color:#f43f5e;background:#18181b;box-shadow:0 0 12px #f43f5e44;max-width:80vw;margin:2em auto 0 auto;padding:1em 2em;border-radius:10px;opacity:0.92;position:relative;z-index:3;white-space:pre;display:none;"></div>
    <div id="fake-error" style="display:none;position:fixed;top:10vh;left:50vw;transform:translateX(-50%);background:#1a1a1a;color:#fff;border:2px solid #f43f5e;padding:1.2em 2em;border-radius:12px;box-shadow:0 0 24px #f43f5e88;z-index:1000;font-family:'Fira Mono',monospace;font-size:1.2em;max-width:80vw;pointer-events:auto;cursor:pointer;">Error: UNCAUGHT EXCEPTION at midnight.js:42<br>TypeError: Cannot read property 'hope' of undefined<br><span style="font-size:0.8em;opacity:0.7;">Click to dismiss</span></div>
  </div>
  <svg class="main-icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#f43f5e" opacity="0.18"/><path d="M32 12v20l14 8" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <audio id="creepy-audio" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b1b1b1b1.mp3" preload="auto"></audio>
  <script>
    // Modern time flicker
    setInterval(() => {
      const d = new Date();
      let h = d.getHours().toString().padStart(2,'0');
      let m = d.getMinutes().toString().padStart(2,'0');
      let s = d.getSeconds().toString().padStart(2,'0');
      document.getElementById('mystery-title').textContent = `${h}:${m}`;
      if (Math.random() < 0.1) document.getElementById('mystery-title').textContent = `${h}:${s}`;
    }, 900);
    // Subtle audio
    setTimeout(()=>{
      document.getElementById('creepy-audio').play();
    }, 1200+Math.random()*1200);
    // Subtle auto-redirect to shuffle
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);

    // --- Broken code and error effects ---
    const codeSnippets = [
      `function midnight() {\n  throw new Error('HopeNotDefinedException');\n}\nmidnight();`,
      `let year = 2026;\nif (year !== 2025) {\n  throw 'TemporalDisplacementError';\n}`,
      `// TODO: fix the loop\nwhile(true) {\n  // ...\n}`,
      `const voided = undefined;\nconsole.log(voided.hope);`,
      `try {\n  process.soul();\n} catch(e) {\n  console.error('soul not found');\n}`,
      `throw new Error('Uncaught midnight exception');`,
      `// SYSTEM FAILURE\n// 0xDEADDEAD\n`,
      `class NewYear {\n  constructor() {\n    throw 'NoFutureError';\n  }\n}`
    ];
    function showCodeLeak() {
      const el = document.getElementById('code-leak');
      el.textContent = codeSnippets[Math.floor(Math.random()*codeSnippets.length)];
      el.style.display = 'block';
      setTimeout(()=>{ el.style.display = 'none'; }, 2200+Math.random()*1200);
    }
    function showFakeError() {
      const el = document.getElementById('fake-error');
      el.style.display = 'block';
      setTimeout(()=>{ el.style.display = 'none'; }, 2600+Math.random()*1200);
    }
    // Randomly show code leak or error popup
    setTimeout(()=>{
      if(Math.random()<0.5) showCodeLeak();
      else showFakeError();
    }, 1200+Math.random()*2000);
    // Allow dismissing error popup
    document.getElementById('fake-error').onclick = function(){ this.style.display='none'; };
    // Occasionally throw nonsense errors in console
    setInterval(()=>{
      if(Math.random()<0.3) {
        const err = [
          'Uncaught MidnightError: null is not a function',
          'TypeError: undefined is not a year',
          'ReferenceError: hope is not defined',
          'SyntaxError: Unexpected midnight',
          'Error: The loop cannot be broken',
          'Fatal: 0xDEADDEAD',
          'Exception: RitualFailedException',
        ];
        console.error(err[Math.floor(Math.random()*err.length)]);
      }
    }, 1800);
  </script>
</body>
</html>
