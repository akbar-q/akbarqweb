<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask For It - New Year</title>
  <style>
    body {
      background: radial-gradient(circle, #000 0%, #333 100%);
      color: #f7e018;
      font-family: 'Permanent Marker', cursive;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pulsebg 2s infinite alternate;
    }
    @keyframes pulsebg {
      0% { background: #000; }
      100% { background: #333; }
    }
    h1 {
      font-size: 3em;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px #f7e018, 0 0 20px #000;
      animation: askpulse 1.2s infinite alternate;
    }
    @keyframes askpulse {
      0% { color: #f7e018; }
      50% { color: #fff; }
      100% { color: #f7e018; }
    }
    .poem {
      margin-top: 2em;
      font-size: 1.4em;
      max-width: 60vw;
      text-align: center;
      font-family: 'Permanent Marker', cursive;
      opacity: 0.95;
      color: #f7e018;
      text-shadow: 0 0 8px #fff;
        animation: askAnim 0.11s infinite alternate, askColor 0.09s infinite alternate, askScale 0.13s infinite alternate, askDisturb 0.11s infinite alternate;
      }
      @keyframes askAnim {
        0% { letter-spacing: 0.1em; }
        100% { letter-spacing: 0.6em; }
      }
      @keyframes askColor {
        0% { color: #f7e018; }
        50% { color: #e17055; }
        100% { color: #636e72; }
      }
      @keyframes askScale {
        0% { transform: scale(1.2) rotate(-20deg); }
        100% { transform: scale(0.8) rotate(30deg); }
      }
      @keyframes askDisturb {
        0% { filter: blur(0px) brightness(1); }
        100% { filter: blur(2px) brightness(1.2); }
    }
    .rain {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <h1>You Asked For It</h1>
  <div class="poem" id="askpoem">You called for the new year.<br>It answered, but not with joy.<br>It crept in, silent and cold.<br>Now it is yours.<br><br>Be careful what you wish for.<br>Time is listening.<br>And it is cruel.</div>
  <div id="ask-icons"></div>
  <canvas class="rain" id="rain"></canvas>
  <script>
    // Rain of yellow letters
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    let letters = 'HAPPYNEWYEAR!?'.split('');
    let fontSize = 32;
    let columns = Math.floor(W / fontSize);
    let drops = Array(columns).fill(1);
    function drawRain() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,W,H);
      ctx.font = fontSize + "px 'Permanent Marker', cursive";
      for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillStyle = `rgba(247,224,24,${0.7+0.3*Math.random()})`;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > H && Math.random() > 0.975){
          drops[i]=0;
        }
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);
    window.addEventListener('resize',()=>{
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      columns = Math.floor(W / fontSize);
      drops = Array(columns).fill(1);
    });
    // Add random font size and color to poem
    const poemEl = document.getElementById('askpoem');
    poemEl.style.fontSize = (1.4 + Math.random()*2.4) + 'em';
    poemEl.style.color = ['#fff','#e17055','#636e72','#fff200','#ff00c8'][Math.floor(Math.random()*5)];
    poemEl.style.transform = `rotate(${Math.random()*70-35}deg)`;
    poemEl.style.textShadow = `0 0 8px #636e72, 0 0 20px #e17055, 0 0 30px #fff200, 0 0 40px #ff00c8`;
    // Add random icons/images
    const icons = [
      '../assets/images/404.jpg',
      '../assets/images/energy.jpg',
      '../assets/images/memorial.jpg',
      '../assets/images/AR.jpg',
      '../assets/images/meme.jpg',
      '../assets/images/broken.jpg',
      '../assets/images/music.jpg',
      '../assets/images/maze.jpg',
      '../assets/images/glitch.jpg',
      '../assets/images/retro.jpg',
      '../assets/images/snake.jpg',
      '../assets/images/water-flow.jpg',
      '../assets/images/slot.jpg',
      '../assets/images/quiz-1.jpg',
      '../assets/images/quiz-2.jpg',
      '../assets/images/quiz-3.jpg',
      '../assets/images/quiz-4.jpg',
      '../assets/images/quiz-5.jpg',
      '../assets/images/quiz-6.jpg',
      '../assets/images/quiz-7.jpg',
      '../assets/images/image-1.jpg',
      '../assets/images/image-2.jpg',
      '../assets/images/image-3.jpg',
      '../assets/images/image-4.jpg',
      '../assets/images/image-5.jpg',
      '../assets/images/image-6.jpg',
      '../assets/images/image-7.jpg',
      '../assets/images/image-8.jpg',
    ];
    for(let i=0;i<5;i++){
      const img = document.createElement('img');
      img.src = icons[Math.floor(Math.random()*icons.length)];
      img.style.position = 'absolute';
      img.style.left = (Math.random()*80)+'vw';
      img.style.top = (Math.random()*80)+'vh';
      img.style.width = (8+Math.random()*22)+'vw';
      img.style.height = 'auto';
      img.style.zIndex = 10+i;
      img.style.filter = 'grayscale(1) contrast(2) blur(2px)';
      img.style.pointerEvents = 'none';
      img.style.animation = `askIcon${i} ${(0.09+Math.random()*0.2).toFixed(2)}s infinite alternate`;
      document.getElementById('ask-icons').appendChild(img);
      const keyframes = `@keyframes askIcon${i} {0%{left:${img.style.left};top:${img.style.top};}100%{left:${Math.random()*80}vw;top:${Math.random()*80}vh;}}`;
      const styleSheet = document.createElement("style");
      styleSheet.type = "text/css";
      styleSheet.innerText = keyframes;
      document.head.appendChild(styleSheet);
    }
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 4000+Math.random()*2000);
  </script>
</body>
</html>
