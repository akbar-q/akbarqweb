<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightmare II - New Year</title>
  <style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #232946;
      color: #e94560;
      font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
      position: relative;
    }
    .nightmare-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.16;
      background: repeating-linear-gradient(120deg, #e94560 0 2px, transparent 2px 40px), repeating-linear-gradient(60deg, #fff2 0 4px, transparent 4px 40px);
      animation: nightmarebgmove 10s linear infinite alternate;
    }
    @keyframes nightmarebgmove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 60px 60px, 30px 30px; }
    }
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 2.7em;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e94560;
      text-shadow: 0 2px 24px #fff1, 0 0 2px #fff, 0 0 8px #e9456044;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
      position: relative;
      animation: titlepop 1.7s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate;
    }
    @keyframes titlepop {
      0% { letter-spacing: 0.04em; transform: scale(1) rotate(-1deg); }
      100% { letter-spacing: 0.18em; transform: scale(1.04) rotate(2deg); }
    }
    .subtitle {
      font-size: 1.1em;
      color: #e94560;
      margin-bottom: 1.2em;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      max-width: 60vw;
      opacity: 0.8;
    }
    .intro {
      font-size: 1.05em;
      color: #fffbe6;
      margin-bottom: 2.2em;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      background: rgba(35,41,70,0.7);
      border-radius: 1em;
      padding: 1.2em 2em;
      box-shadow: 0 2px 24px #e9456022;
    }
    .icon-row {
      display: flex;
      gap: 2.2em;
      margin-bottom: 2.5em;
      z-index: 2;
    }
    .icon-row svg {
      width: 2.8em;
      height: 2.8em;
      fill: #e94560;
      opacity: 0.82;
      filter: drop-shadow(0 0 8px #e9456044);
      transition: transform 0.18s, fill 0.18s, opacity 0.18s;
      cursor: pointer;
    }
    .icon-row svg:hover {
      transform: scale(1.18) rotate(-8deg);
      fill: #fff;
      opacity: 1;
    }
    .main-icon {
      position: absolute;
      top: 8vh;
      right: 8vw;
      width: 7em;
      height: 7em;
      opacity: 0.13;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px) drop-shadow(0 0 32px #e94560);
      animation: iconfloat 7s ease-in-out infinite alternate;
    }
    @keyframes iconfloat {
      0% { transform: scale(1) rotate(-8deg) translateY(0); }
      100% { transform: scale(1.08) rotate(12deg) translateY(18px); }
    }
  </style>
  <div class="nightmare-bg"></div>
  <div class="main-content">
    <h1>Nightmare II</h1>
    <div class="subtitle">The nightmare returns</div>
    <div class="intro">
      Shadows crawl across the clock. Time is a monster.<br>
      Sleep is a trap.<br>
      <span style="color:#e94560;font-weight:bold;">There is no waking up.</span>
    </div>
    <div class="icon-row">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 3.59 8 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2v20" stroke="#e94560" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><path d="M2 12h20" stroke="#e94560" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#e94560" stroke-width="2" fill="none"/></svg>
    </div>
  </div>
  <svg class="main-icon" viewBox="0 0 64 64"><ellipse cx="32" cy="32" rx="28" ry="18" fill="#e94560" opacity="0.18"/><ellipse cx="32" cy="32" rx="18" ry="8" stroke="#e94560" stroke-width="4" fill="none"/></svg>
  <script>
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 5000+Math.random()*2000);
  </script>
  </style>
</head>
<body>
  <h1 id="glitch-title">Resolution Lost</h1>
  <div id="poem" style="max-width:60vw; margin:2em auto; text-align:center; opacity:0.85; font-size:1.2em;"></div>
  <img class="nightmare-img" id="randimg" src="../assets/images/maze.jpg" alt="nightmare">
  <canvas id="rain" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5;"></canvas>
  <div class="jumpscare" id="jumpscare"></div>
  <audio id="jumpscare-audio" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b1b1b1b1.mp3" preload="auto"></audio>
  <script>
    // Dark cryptic poem
    const poem = `A wish whispered, a promise drowned.<br>
    The calendar bleeds, the world spins round.<br>
    In the static, your name is erased.<br>
    The future is empty, the past is replaced.<br>
    <br>
    The mirror cracks, the hour is late.<br>
    You search for the door, but it’s only fate.`;
    document.getElementById('poem').innerHTML = poem;
    // Glitch title effect
    setInterval(()=>{
      let t = document.getElementById('glitch-title');
      t.style.textShadow = Math.random()>0.5 ? '2px 0 #39ff14, -2px 0 #fff' : '0 0 10px #39ff14, 0 0 20px #000';
      t.style.opacity = 0.7 + 0.3*Math.random();
    }, 200);
    // Random image from assets/images
    const images = [
      '../assets/images/maze.jpg',
      '../assets/images/slot.jpg',
      '../assets/images/quiz-1.jpg',
      '../assets/images/quiz-2.jpg',
      '../assets/images/quiz-3.jpg',
      '../assets/images/quiz-4.jpg',
      '../assets/images/quiz-5.jpg',
      '../assets/images/quiz-6.jpg',
      '../assets/images/quiz-7.jpg',
      '../assets/images/image-1.jpg',
      '../assets/images/image-2.jpg',
      '../assets/images/image-3.jpg',
      '../assets/images/image-4.jpg',
      '../assets/images/image-5.jpg',
      '../assets/images/image-6.jpg',
      '../assets/images/image-7.jpg',
      '../assets/images/image-8.jpg',
    ];
    document.getElementById('randimg').src = images[Math.floor(Math.random() * images.length)];
    // Rain of random letters
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=~'.split('');
    let fontSize = 22;
    let columns = Math.floor(W / fontSize);
    let drops = Array(columns).fill(1);
    function drawRain() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,W,H);
      ctx.font = fontSize + "px monospace";
      for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillStyle = `rgba(57,255,20,${0.7+0.3*Math.random()})`;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > H && Math.random() > 0.975){
          drops[i]=0;
        }
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);
    window.addEventListener('resize',()=>{
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      columns = Math.floor(W / fontSize);
      drops = Array(columns).fill(1);
    });
    // Jumpscare logic
    setTimeout(() => {
      if (Math.random() < 0.4) {
        document.getElementById('jumpscare').style.display = 'flex';
        document.getElementById('jumpscare-audio').play();
        setTimeout(() => {
          document.getElementById('jumpscare').style.display = 'none';
        }, 1000);
      }
    }, 1500 + Math.random() * 2500);
    // Auto-redirect to shuffle
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
