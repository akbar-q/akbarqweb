<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wilt - New Year</title>
  <style>
    body {
      background: #2d1e2f;
      color: #f67280;
      font-family: 'Amatic SC', cursive;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: wiltbg 2s infinite alternate;
    }
    @keyframes wiltbg {
      0% { background: #2d1e2f; }
      100% { background: #355c7d; }
    }
    h1 {
      font-size: 2.7em;
      text-shadow: 0 0 10px #f67280, 0 0 20px #fff;
      animation: wilt 1.2s infinite alternate;
    }
    @keyframes wilt {
      0% { color: #f67280; }
      50% { color: #fff; }
      100% { color: #f67280; }
    }
    .poem {
      margin-top: 2em;
      font-size: 2.3em;
      max-width: 60vw;
      text-align: center;
      font-family: 'Amatic SC', cursive;
      opacity: 0.95;
      color: #fff;
      text-shadow: 0 0 8px #f67280, 0 0 20px #fdcb6e;
      animation: wiltAnim 0.14s infinite alternate, wiltColor 0.09s infinite alternate, wiltScale 0.17s infinite alternate;
    }
    @keyframes wiltAnim {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.5em; }
    }
    @keyframes wiltColor {
      0% { color: #fff; }
      50% { color: #fdcb6e; }
      100% { color: #f67280; }
    }
    @keyframes wiltScale {
      0% { transform: scale(1.1) rotate(-9deg); }
      100% { transform: scale(0.8) rotate(17deg); }
    }
    .wilt {
      font-size: 1.5em;
      color: #f67280;
      opacity: 0.7;
      margin-top: 2em;
      animation: wilt 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Wilt</h1>
  <div class="poem" id="wiltpoem">The year wilts before it blooms.<br>Resolutions fade, dreams wither.<br>Time is a garden of ghosts.<br>Look. The petals are falling.<br><br>What will you plant?</div>
  <div class="wilt" id="wilt"></div>
  <script>
    const wilts = [
      "Dreams fade quickly.",
      "Ghosts tend the garden.",
      "Petals fall in silence.",
      "You are the gardener.",
      "What will grow next?"
    ];
    let idx = 0;
    function showWilt() {
      document.getElementById('wilt').textContent = wilts[idx];
      idx = (idx + 1) % wilts.length;
      setTimeout(showWilt, 2500 + Math.random()*1500);
    }
    showWilt();
    // Add random font size and color to poem
    const poemEl = document.getElementById('wiltpoem');
    poemEl.style.fontSize = (1.3 + Math.random()*2.3) + 'em';
    poemEl.style.color = ['#fff','#fdcb6e','#f67280','#fff200'][Math.floor(Math.random()*4)];
    poemEl.style.transform = `rotate(${Math.random()*30-15}deg)`;
    poemEl.style.textShadow = `0 0 8px #f67280, 0 0 20px #fdcb6e, 0 0 30px #fff200`;
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
