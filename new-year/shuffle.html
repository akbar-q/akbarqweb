<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightmare Shuffle</title>
  <script>
    // List of possible pages (mix of new, eol, gogogo, meme, etc.)
    const pages = [
      'index.html',
      'nightmare1.html',
      'nightmare2.html',
      'malicious-time.html',
      'ask-for-it.html',
      'echoes.html',
      'fracture.html',
      'hollow.html',
      'wilt.html',
      'unravel.html',
      'plea.html',
      'guilt.html',
      'alone.html',
      'unheard.html',
      'forsaken.html',
      'release.html',
      'embrace.html',
      'right.html',
      'rest.html',
      'inevitable.html',
      'shuffle.html' // allow looping back to itself for infinite loop
    ];
    // Shuffle with memory: avoid recently shown pages
    let history = JSON.parse(localStorage.getItem('shuffleHistory') || '[]');
    const maxHistory = Math.max(3, Math.floor(pages.length/3));
    function shuffleLoop() {
      let next, tries = 0;
      do {
        next = pages[Math.floor(Math.random() * pages.length)];
        tries++;
      } while ((window.location.pathname.endsWith(next) || history.includes(next)) && tries < 20);
      history.push(next);
      if (history.length > maxHistory) history = history.slice(-maxHistory);
      localStorage.setItem('shuffleHistory', JSON.stringify(history));
      setTimeout(() => {
        window.location.href = next;
      }, 500 + Math.random() * 1200);
    }
    shuffleLoop();
  </script>
  <style>
    body {
      background: #000;
      color: #e60000;
      font-family: 'Share Tech Mono', 'Comic Sans MS', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 2em;
      animation: flashbg 0.18s infinite alternate;
      overflow: hidden;
    }
    @keyframes flashbg {
      0% { background: #000; }
      20% { background: #e60000; }
      40% { background: #fff; }
      60% { background: #00ffea; }
      80% { background: #3a3a3a; }
      100% { background: #000; }
    }
    #mystery-shuffle {
      position: absolute;
      left: 10vw;
      top: 10vh;
      font-size: 2.2em;
      font-family: 'Creepster', 'Share Tech Mono', cursive;
      color: #fff200;
      text-shadow: 0 0 10px #e60000, 0 0 20px #fff;
      animation: moveText 0.3s infinite alternate, colorflash 0.11s infinite alternate;
      z-index: 2;
    }
    @keyframes moveText {
      0% { left: 10vw; top: 10vh; }
      100% { left: 60vw; top: 60vh; }
    }
    @keyframes colorflash {
      0% { color: #fff200; }
      50% { color: #e60000; }
      100% { color: #fff; }
    }
  </style>
</head>
<body>
  <div id="mystery-shuffle" style="opacity:0.8; font-size:1.3em; max-width:70vw; text-align:center;"></div>
  <canvas id="rain" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5;"></canvas>
  <script>
    // Mysterious shuffle text
    const texts = [
      "You are not where you think you are.",
      "The path is lost. The path is found.",
      "Every click is a mistake.",
      "You are being watched.",
      "There is no escape.",
      "The loop continues. The loop continues.",
      "You are still here. Why?",
      "The new year is a lie.",
      "You are not alone in this shuffle."
    ];
    let idx = Math.floor(Math.random()*texts.length);
    document.getElementById('mystery-shuffle').textContent = texts[idx];
    // Rain of random letters
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=~'.split('');
    let fontSize = 22;
    let columns = Math.floor(W / fontSize);
    let drops = Array(columns).fill(1);
    function drawRain() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,W,H);
      ctx.font = fontSize + "px monospace";
      for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillStyle = `rgba(230,0,0,${0.7+0.3*Math.random()})`;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > H && Math.random() > 0.975){
          drops[i]=0;
        }
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);
    window.addEventListener('resize',()=>{
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      columns = Math.floor(W / fontSize);
      drops = Array(columns).fill(1);
    });
  </script>
</body>
</html>
