<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightmare Shuffle</title>
  <script>
    // List of possible pages (mix of new, eol, gogogo, meme, etc.)
    const pages = [
      'index.html',
      'nightmare1.html',
      'nightmare2.html',
      'malicious-time.html',
      'ask-for-it.html',
      'echoes.html',
      'fracture.html',
      'hollow.html',
      'wilt.html',
      'unravel.html',
      'plea.html',
      'guilt.html',
      'alone.html',
      'unheard.html',
      'forsaken.html',
      'release.html',
      'embrace.html',
      'right.html',
      'rest.html',
      'inevitable.html',
      'img-nightmare-1.html',
      'img-nightmare-2.html',
      'img-nightmare-3.html',
      'img-nightmare-4.html',
      'img-nightmare-5.html',
      'img-nightmare-6.html',
      'img-nightmare-7.html',
      'img-nightmare-8.html',
      'shuffle.html' // allow looping back to itself for infinite loop
    ];
    // Cycle through a shuffled list of pages, hitting every page before repeating
    let cycle = JSON.parse(localStorage.getItem('shuffleCycle') || 'null');
    let idx = parseInt(localStorage.getItem('shuffleIdx') || '0');
    function shuffleArray(array) {
      for (let i = array.length - 2; i > 0; i--) { // exclude shuffle.html itself from shuffle
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    if (!cycle || !Array.isArray(cycle) || cycle.length !== pages.length) {
      cycle = shuffleArray([...pages]);
      idx = 0;
    }
    // Always skip shuffle.html itself
    while (cycle[idx] === 'shuffle.html') {
      idx = (idx + 1) % cycle.length;
    }
    localStorage.setItem('shuffleCycle', JSON.stringify(cycle));
    localStorage.setItem('shuffleIdx', ((idx+1)%cycle.length).toString());
    setTimeout(() => {
      window.location.href = cycle[idx];
    }, 500 + Math.random() * 1200);
  </script>
  <style>
    body {
      background: #000;
      color: #e60000;
      font-family: 'Share Tech Mono', 'Comic Sans MS', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 2em;
      overflow: hidden;
      /* Animation will be set randomly by JS */
    }
    #mystery-shuffle {
      position: absolute;
      left: 10vw;
      top: 10vh;
      font-size: 2.2em;
      font-family: 'Creepster', 'Share Tech Mono', cursive;
      color: #fff200;
      text-shadow: 0 0 10px #e60000, 0 0 20px #fff;
      z-index: 2;
      /* Animation will be set randomly by JS */
    }
  </style>
</head>
<body>
  <div id="mystery-shuffle" style="opacity:0.8; font-size:1.3em; max-width:70vw; text-align:center;"></div>
  <canvas id="rain" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5;"></canvas>
  <script>
    // Mysterious shuffle text
    const texts = [
      "You are not where you think you are.",
      "The path is lost. The path is found.",
      "Every click is a mistake.",
      "You are being watched.",
      "There is no escape.",
      "The loop continues. The loop continues.",
      "You are still here. Why?",
      "The new year is a lie.",
      "You are not alone in this shuffle."
    ];
    let idx = Math.floor(Math.random()*texts.length);
    document.getElementById('mystery-shuffle').textContent = texts[idx];
    // Rain of random letters
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    let letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=~'.split('');
    let fontSize = 22;
    let columns = Math.floor(W / fontSize);
    let drops = Array(columns).fill(1);
    function drawRain() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,W,H);
      ctx.font = fontSize + "px monospace";
      for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillStyle = `rgba(230,0,0,${0.7+0.3*Math.random()})`;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > H && Math.random() > 0.975){
          drops[i]=0;
        }
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);
    window.addEventListener('resize',()=>{
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      columns = Math.floor(W / fontSize);
      drops = Array(columns).fill(1);
    });
  </script>
</body>
</html>
