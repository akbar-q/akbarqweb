<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fracture - New Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #18181b;
      color: #00fff5;
      font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
      position: relative;
    }
    .fracture-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.18;
      background: repeating-linear-gradient(135deg, #23272f 0 2px, transparent 2px 40px), repeating-linear-gradient(45deg, #00fff522 0 4px, transparent 4px 40px);
      animation: bgmove 12s linear infinite alternate;
    }
    @keyframes bgmove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 80px 80px, 40px 40px; }
    }
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 2.8em;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #00fff5;
      text-shadow: 0 2px 24px #fff1, 0 0 2px #fff, 0 0 8px #00fff544;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
      position: relative;
      animation: titlepop 1.8s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate;
    }
    @keyframes titlepop {
      0% { letter-spacing: 0.04em; transform: scale(1) rotate(-1deg); }
      100% { letter-spacing: 0.18em; transform: scale(1.04) rotate(2deg); }
    }
    .subtitle {
      font-size: 1.1em;
      color: #a1a1aa;
      margin-bottom: 1.2em;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      max-width: 60vw;
    }
    .intro {
      font-size: 1.05em;
      color: #f1f5f9;
      margin-bottom: 2.2em;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      background: rgba(24,24,27,0.7);
      border-radius: 1em;
      padding: 1.2em 2em;
      box-shadow: 0 2px 24px #00fff522;
    }
    .icon-row {
      display: flex;
      gap: 2.2em;
      margin-bottom: 2.5em;
      z-index: 2;
    }
    .icon-row svg {
      width: 2.8em;
      height: 2.8em;
      fill: #00fff5;
      opacity: 0.82;
      filter: drop-shadow(0 0 8px #00fff544);
      transition: transform 0.18s, fill 0.18s, opacity 0.18s;
      cursor: pointer;
    }
    .icon-row svg:hover {
      transform: scale(1.18) rotate(-8deg);
      fill: #fff;
      opacity: 1;
    }
    .main-icon {
      position: absolute;
      top: 8vh;
      right: 8vw;
      width: 7em;
      height: 7em;
      opacity: 0.13;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px) drop-shadow(0 0 32px #00fff5);
      animation: iconfloat 7s ease-in-out infinite alternate;
    }
    @keyframes iconfloat {
      0% { transform: scale(1) rotate(-8deg) translateY(0); }
      100% { transform: scale(1.08) rotate(12deg) translateY(18px); }
    }
  </style>
</head>
<body>
  <div class="fracture-bg"></div>
  <div class="main-content">
    <h1>Fracture</h1>
    <div class="subtitle">The year shatters at midnight</div>
    <div class="intro">
      Promises splinter, dreams shatter. Time is a broken mirror.<br>
      You are in every shard. Pieces never fit again.<br>
      <span style="color:#00fff5;font-weight:bold;">You cannot escape the reflection.</span>
    </div>
    <div class="icon-row">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M21 3L3 21" stroke="#00fff5" stroke-width="2"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
    </div>
  </div>
  <svg class="main-icon" viewBox="0 0 64 64"><polygon points="32,2 62,32 32,62 2,32" fill="#00fff5" opacity="0.18"/><polyline points="32,2 32,62" stroke="#00fff5" stroke-width="4"/><polyline points="2,32 62,32" stroke="#00fff5" stroke-width="4"/></svg>
  <script>
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 5000+Math.random()*2000);
  </script>
</body>
</html>
