<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inevitable - New Year</title>
  <style>
    body {
      background: #353b48;
      color: #fbc531;
      font-family: 'Bitter', serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: inevitable-bg 2s infinite alternate;
    }
    @keyframes inevitable-bg {
      0% { background: #353b48; }
      100% { background: #718093; }
    }
    h1 {
      font-size: 2.7em;
      text-shadow: 0 0 10px #fbc531, 0 0 20px #fff;
      animation: inevitable-title 1.2s infinite alternate;
    }
    @keyframes inevitable-title {
      0% { color: #fbc531; }
      50% { color: #fff; }
      100% { color: #fbc531; }
    }
    .poem {
      margin-top: 2em;
      font-size: 2.6em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.99;
      color: #fff;
      text-shadow: 0 0 8px #636e72, 0 0 20px #e17055, 0 0 30px #fff200;
      animation: inevitableAnim 0.07s infinite alternate, inevitableColor 0.09s infinite alternate, inevitableScale 0.13s infinite alternate, inevitableDisturb 0.11s infinite alternate;
    }
    @keyframes inevitableAnim {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.8em; }
    }
    @keyframes inevitableColor {
      0% { color: #fff; }
      50% { color: #e17055; }
      100% { color: #636e72; }
    }
    @keyframes inevitableScale {
      0% { transform: scale(1.3) rotate(-25deg); }
      100% { transform: scale(0.6) rotate(35deg); }
    }
    @keyframes inevitableDisturb {
      0% { filter: blur(0px) brightness(1); }
      100% { filter: blur(3px) brightness(1.4); }
    }
    .inevitable {
      font-size: 1.5em;
      color: #fbc531;
      opacity: 0.7;
      margin-top: 2em;
      animation: inevitable-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Inevitable</h1>
  <div class="poem" id="inevitablepoem">Death is inevitable, but not cruel.<br>It is the right of all living.<br>Time brings the end as a gift.<br><br>Accept it. It is yours to claim.</div>
  <div id="inevitable-icons"></div>
  <div class="inevitable" id="inevitable"></div>
  <script>
    const inevitableLines = [
      "The end is a gift.",
      "You are allowed to accept it.",
      "It is not cruel, only true.",
      "You have earned your peace.",
      "Claim what is yours."
    ];
    let idx = 0;
    function showInevitable() {
      document.getElementById('inevitable').textContent = inevitableLines[idx];
      idx = (idx + 1) % inevitableLines.length;
      setTimeout(showInevitable, 2500 + Math.random()*1500);
    }
    showInevitable();
    // Add random font size and color to poem
    const poemEl = document.getElementById('inevitablepoem');
    poemEl.style.fontSize = (1.6 + Math.random()*2.6) + 'em';
    poemEl.style.color = ['#fff','#e17055','#636e72','#fff200','#ff00c8'][Math.floor(Math.random()*5)];
    poemEl.style.transform = `rotate(${Math.random()*80-40}deg)`;
    poemEl.style.textShadow = `0 0 8px #636e72, 0 0 20px #e17055, 0 0 30px #fff200, 0 0 40px #ff00c8`;
    // Add random icons/images
    const icons = [
      '../assets/images/404.jpg',
      '../assets/images/energy.jpg',
      '../assets/images/memorial.jpg',
      '../assets/images/AR.jpg',
      '../assets/images/meme.jpg',
      '../assets/images/broken.jpg',
      '../assets/images/music.jpg',
      '../assets/images/maze.jpg',
      '../assets/images/glitch.jpg',
      '../assets/images/retro.jpg',
      '../assets/images/snake.jpg',
      '../assets/images/water-flow.jpg',
      '../assets/images/slot.jpg',
      '../assets/images/quiz-1.jpg',
      '../assets/images/quiz-2.jpg',
      '../assets/images/quiz-3.jpg',
      '../assets/images/quiz-4.jpg',
      '../assets/images/quiz-5.jpg',
      '../assets/images/quiz-6.jpg',
      '../assets/images/quiz-7.jpg',
      '../assets/images/image-1.jpg',
      '../assets/images/image-2.jpg',
      '../assets/images/image-3.jpg',
      '../assets/images/image-4.jpg',
      '../assets/images/image-5.jpg',
      '../assets/images/image-6.jpg',
      '../assets/images/image-7.jpg',
      '../assets/images/image-8.jpg',
    ];
    for(let i=0;i<5;i++){
      const img = document.createElement('img');
      img.src = icons[Math.floor(Math.random()*icons.length)];
      img.style.position = 'absolute';
      img.style.left = (Math.random()*80)+'vw';
      img.style.top = (Math.random()*80)+'vh';
      img.style.width = (8+Math.random()*22)+'vw';
      img.style.height = 'auto';
      img.style.zIndex = 10+i;
      img.style.filter = 'grayscale(1) contrast(2) blur(2px)';
      img.style.pointerEvents = 'none';
      img.style.animation = `inevitableIcon${i} ${(0.09+Math.random()*0.2).toFixed(2)}s infinite alternate`;
      document.getElementById('inevitable-icons').appendChild(img);
      const keyframes = `@keyframes inevitableIcon${i} {0%{left:${img.style.left};top:${img.style.top};}100%{left:${Math.random()*80}vw;top:${Math.random()*80}vh;}}`;
      const styleSheet = document.createElement("style");
      styleSheet.type = "text/css";
      styleSheet.innerText = keyframes;
      document.head.appendChild(styleSheet);
    }
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 4000+Math.random()*2000);
  </script>
</body>
</html>
