<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rest - New Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #222f3e;
      color: #00a8ff;
      font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
      position: relative;
    }
    .rest-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.18;
      background: repeating-linear-gradient(135deg, #273c75 0 2px, transparent 2px 40px), repeating-linear-gradient(45deg, #00a8ff22 0 4px, transparent 4px 40px);
      animation: bgmove 12s linear infinite alternate;
    }
    @keyframes bgmove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 80px 80px, 40px 40px; }
    }
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 2.8em;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #00a8ff;
      text-shadow: 0 2px 24px #fff1, 0 0 2px #fff, 0 0 8px #00a8ff44;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
      position: relative;
      animation: titlepop 1.8s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate;
    }
    @keyframes titlepop {
      0% { letter-spacing: 0.04em; transform: scale(1) rotate(-1deg); }
      100% { letter-spacing: 0.18em; transform: scale(1.04) rotate(2deg); }
    }
    .subtitle {
      font-size: 1.1em;
      color: #a1a1aa;
      margin-bottom: 1.2em;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      max-width: 60vw;
    }
    .intro {
      font-size: 1.05em;
      color: #f1f5f9;
      margin-bottom: 2.2em;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      background: rgba(34,47,62,0.7);
      border-radius: 1em;
      padding: 1.2em 2em;
      box-shadow: 0 2px 24px #00a8ff22;
    }
    .icon-row {
      display: flex;
      gap: 2.2em;
      margin-bottom: 2.5em;
      z-index: 2;
    }
    .icon-row svg {
      width: 2.8em;
      height: 2.8em;
      fill: #00a8ff;
      opacity: 0.82;
      filter: drop-shadow(0 0 8px #00a8ff44);
      transition: transform 0.18s, fill 0.18s, opacity 0.18s;
      cursor: pointer;
    }
    .icon-row svg:hover {
      transform: scale(1.18) rotate(-8deg);
      fill: #fff;
      opacity: 1;
    }
    .main-icon {
      position: absolute;
      top: 8vh;
      right: 8vw;
      width: 7em;
      height: 7em;
      opacity: 0.13;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px) drop-shadow(0 0 32px #00a8ff);
      animation: iconfloat 7s ease-in-out infinite alternate;
    }
    @keyframes iconfloat {
      0% { transform: scale(1) rotate(-8deg) translateY(0); }
      100% { transform: scale(1.08) rotate(12deg) translateY(18px); }
    }
  </style>
</head>
<body>
  <div class="rest-bg"></div>
  <img src="http://www.dos486.com/errors/index2.html" alt="error3" style="position:fixed;top:60vh;left:65vw;width:160px;height:60px;object-fit:cover;object-position:0 0;z-index:10;box-shadow:0 0 18px #000b;opacity:0.93;clip-path:inset(0 0 20px 20px);pointer-events:none;" />
  <div class="main-content">
    <h1>Rest</h1>
    <div class="subtitle">Rest is not weakness</div>
    <div class="intro">
      It is the final kindness. Death is a right, a return to peace.<br>
      Let go. You are allowed to rest.<br>
      <span style="color:#00a8ff;font-weight:bold;">Peace is deserved.</span>
    </div>
    <div class="icon-row">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20a10 10 0 0 1 0-20zm0 0v10l6 3" stroke="#00a8ff" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0zm10-7v7l5 2.5" stroke="#00a8ff" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#00a8ff" stroke-width="2" fill="none"/><path d="M12 6v6l4 2" stroke="#00a8ff" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20a10 10 0 0 1 0-20zm0 0v10l6 3" stroke="#00a8ff" stroke-width="2" fill="none"/></svg>
    </div>
    <div id="code-leak" style="font-family:'Fira Mono',monospace;font-size:1.1em;color:#00a8ff;background:#222f3e;box-shadow:0 0 12px #00a8ff44;max-width:80vw;margin:2em auto 0 auto;padding:1em 2em;border-radius:10px;opacity:0.92;position:relative;z-index:3;white-space:pre;display:none;"></div>
    <div id="fake-error" style="display:none;position:fixed;top:10vh;left:50vw;transform:translateX(-50%);background:#1a1a1a;color:#fff;border:2px solid #00a8ff;padding:1.2em 2em;border-radius:12px;box-shadow:0 0 24px #00a8ff88;z-index:1000;font-family:'Fira Mono',monospace;font-size:1.2em;max-width:80vw;pointer-events:auto;cursor:pointer;">Error: REST_OVERFLOW at rest.js:9<br>TypeError: Cannot read property 'peace' of undefined<br><span style="font-size:0.8em;opacity:0.7;">Click to dismiss</span></div>
  </div>
  <svg class="main-icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#00a8ff" opacity="0.18"/><path d="M32 16v24l16 8" stroke="#00a8ff" stroke-width="4" fill="none"/></svg>
  <script>
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 5000+Math.random()*2000);
    // --- Broken code and error effects ---
    const codeSnippets = [
      `function rest() {\n  throw new Error('PeaceNotFoundException');\n}\nrest();`,
      `let peace = 2025;\nif (peace < 2026) {\n  throw 'RestError';\n}`,
      `// TODO: fix the rest\nwhile(true) {\n  // ...\n}`,
      `const peace = undefined;\nconsole.log(peace.now);`,
      `try {\n  process.rest();\n} catch(e) {\n  console.error('rest not found');\n}`,
      `throw new Error('Uncaught rest exception');`,
      `// SYSTEM FAILURE\n// 0xDEADC0DE\n`,
      `class Rest {\n  constructor() {\n    throw 'NoPeaceError';\n  }\n}`
    ];
    function showCodeLeak() {
      const el = document.getElementById('code-leak');
      el.textContent = codeSnippets[Math.floor(Math.random()*codeSnippets.length)];
      el.style.display = 'block';
      setTimeout(()=>{ el.style.display = 'none'; }, 2200+Math.random()*1200);
    }
    function showFakeError() {
      const el = document.getElementById('fake-error');
      el.style.display = 'block';
      setTimeout(()=>{ el.style.display = 'none'; }, 2600+Math.random()*1200);
    }
    // Randomly show code leak or error popup
    setTimeout(()=>{
      if(Math.random()<0.5) showCodeLeak();
      else showFakeError();
    }, 1200+Math.random()*2000);
    // Allow dismissing error popup
    document.getElementById('fake-error').onclick = function(){ this.style.display='none'; };
    // Occasionally throw nonsense errors in console
    setInterval(()=>{
      if(Math.random()<0.3) {
        const err = [
          'Uncaught RestError: null is not peace',
          'TypeError: undefined is not a rest',
          'ReferenceError: peace is not defined',
          'SyntaxError: Unexpected rest',
          'Error: The rest cannot be found',
          'Fatal: 0xDEADC0DE',
          'Exception: RestOverflowException',
        ];
        console.error(err[Math.floor(Math.random()*err.length)]);
      }
    }, 1800);
  </script>
</body>
</html>
