<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rest - New Year</title>
  <style>
    body {
      background: #222f3e;
      color: #00a8ff;
      font-family: 'Playfair Display', serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: rest-bg 2s infinite alternate;
    }
    @keyframes rest-bg {
      0% { background: #222f3e; }
      100% { background: #273c75; }
    }
    h1 {
      font-size: 2.6em;
      text-shadow: 0 0 10px #00a8ff, 0 0 20px #fff;
      animation: rest-title 1.2s infinite alternate;
    }
    @keyframes rest-title {
      0% { color: #00a8ff; }
      50% { color: #fff; }
      100% { color: #00a8ff; }
    }
    .poem {
      margin-top: 2em;
      font-size: 2.5em;
      max-width: 60vw;
      text-align: center;
      opacity: 0.98;
      color: #fff;
      text-shadow: 0 0 8px #636e72, 0 0 20px #e17055, 0 0 30px #fff200;
      animation: restAnim 0.09s infinite alternate, restColor 0.07s infinite alternate, restScale 0.13s infinite alternate, restDisturb 0.11s infinite alternate;
    }
    @keyframes restAnim {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.7em; }
    }
    @keyframes restColor {
      0% { color: #fff; }
      50% { color: #e17055; }
      100% { color: #636e72; }
    }
    @keyframes restScale {
      0% { transform: scale(1.2) rotate(-15deg); }
      100% { transform: scale(0.7) rotate(25deg); }
    }
    @keyframes restDisturb {
      0% { filter: blur(0px) brightness(1); }
      100% { filter: blur(2px) brightness(1.3); }
    }
    .rest {
      font-size: 1.5em;
      color: #00a8ff;
      opacity: 0.7;
      margin-top: 2em;
      animation: rest-title 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Rest</h1>
  <div class="poem" id="restpoem">Rest is not weakness.<br>It is the final kindness.<br>Death is a right, a return to peace.<br><br>Let go. You are allowed to rest.</div>
  <div id="rest-icons"></div>
  <div class="rest" id="rest"></div>
  <script>
    const restLines = [
      "Peace is deserved.",
      "Rest is a right.",
      "You are allowed to stop.",
      "The end is gentle.",
      "You have earned your rest."
    ];
    let idx = 0;
    function showRest() {
      document.getElementById('rest').textContent = restLines[idx];
      idx = (idx + 1) % restLines.length;
      setTimeout(showRest, 2500 + Math.random()*1500);
    }
    showRest();
    // Add random font size and color to poem
    const poemEl = document.getElementById('restpoem');
    poemEl.style.fontSize = (1.5 + Math.random()*2.5) + 'em';
    poemEl.style.color = ['#fff','#e17055','#636e72','#fff200','#ff00c8'][Math.floor(Math.random()*5)];
    poemEl.style.transform = `rotate(${Math.random()*60-30}deg)`;
    poemEl.style.textShadow = `0 0 8px #636e72, 0 0 20px #e17055, 0 0 30px #fff200, 0 0 40px #ff00c8`;
    // Add random icons/images
    const icons = [
      '../assets/images/404.jpg',
      '../assets/images/energy.jpg',
      '../assets/images/memorial.jpg',
      '../assets/images/AR.jpg',
      '../assets/images/meme.jpg',
      '../assets/images/broken.jpg',
      '../assets/images/music.jpg',
      '../assets/images/maze.jpg',
      '../assets/images/glitch.jpg',
      '../assets/images/retro.jpg',
      '../assets/images/snake.jpg',
      '../assets/images/water-flow.jpg',
      '../assets/images/slot.jpg',
      '../assets/images/quiz-1.jpg',
      '../assets/images/quiz-2.jpg',
      '../assets/images/quiz-3.jpg',
      '../assets/images/quiz-4.jpg',
      '../assets/images/quiz-5.jpg',
      '../assets/images/quiz-6.jpg',
      '../assets/images/quiz-7.jpg',
      '../assets/images/image-1.jpg',
      '../assets/images/image-2.jpg',
      '../assets/images/image-3.jpg',
      '../assets/images/image-4.jpg',
      '../assets/images/image-5.jpg',
      '../assets/images/image-6.jpg',
      '../assets/images/image-7.jpg',
      '../assets/images/image-8.jpg',
    ];
    for(let i=0;i<5;i++){
      const img = document.createElement('img');
      img.src = icons[Math.floor(Math.random()*icons.length)];
      img.style.position = 'absolute';
      img.style.left = (Math.random()*80)+'vw';
      img.style.top = (Math.random()*80)+'vh';
      img.style.width = (8+Math.random()*22)+'vw';
      img.style.height = 'auto';
      img.style.zIndex = 10+i;
      img.style.filter = 'grayscale(1) contrast(2) blur(2px)';
      img.style.pointerEvents = 'none';
      img.style.animation = `restIcon${i} ${(0.09+Math.random()*0.2).toFixed(2)}s infinite alternate`;
      document.getElementById('rest-icons').appendChild(img);
      const keyframes = `@keyframes restIcon${i} {0%{left:${img.style.left};top:${img.style.top};}100%{left:${Math.random()*80}vw;top:${Math.random()*80}vh;}}`;
      const styleSheet = document.createElement("style");
      styleSheet.type = "text/css";
      styleSheet.innerText = keyframes;
      document.head.appendChild(styleSheet);
    }
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 4000+Math.random()*2000);
  </script>
</body>
</html>
