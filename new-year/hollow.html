<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hollow - New Year</title>
  <style>
    body {
      background: #222831;
      color: #ffd369;
      font-family: 'Indie Flower', cursive;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: hollowbg 2s infinite alternate;
    }
    @keyframes hollowbg {
      0% { background: #222831; }
      100% { background: #393e46; }
    }
    h1 {
      font-size: 2.6em;
      text-shadow: 0 0 10px #ffd369, 0 0 20px #fff;
      animation: hollow 1.2s infinite alternate;
    }
    @keyframes hollow {
      0% { color: #ffd369; }
      50% { color: #fff; }
      100% { color: #ffd369; }
    }
    .poem {
      margin-top: 2em;
      font-size: 2.2em;
      max-width: 60vw;
      text-align: center;
      font-family: 'Indie Flower', cursive;
      opacity: 0.95;
      color: #fff;
      text-shadow: 0 0 8px #ffd369, 0 0 20px #e17055;
      animation: hollowAnim 0.18s infinite alternate, hollowColor 0.13s infinite alternate, hollowScale 0.21s infinite alternate;
    }
    @keyframes hollowAnim {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.4em; }
    }
    @keyframes hollowColor {
      0% { color: #fff; }
      50% { color: #e17055; }
      100% { color: #ffd369; }
    }
    @keyframes hollowScale {
      0% { transform: scale(1.1) rotate(-5deg); }
      100% { transform: scale(0.8) rotate(10deg); }
    }
    .hollow {
      font-size: 1.5em;
      color: #ffd369;
      opacity: 0.7;
      margin-top: 2em;
      animation: hollow 1.5s infinite alternate;
    }
  </style>
</head>
<body>
  <h1>Hollow</h1>
  <div class="poem" id="hollowpoem">The new year is hollow.<br>It rings with empty promises.<br>Time is a shell, echoing your hopes.<br>Listen. The emptiness is loud.<br><br>What do you hear?</div>
  <div class="hollow" id="hollow"></div>
  <script>
    const hollows = [
      "Echoes fill the void.",
      "Promises are empty.",
      "The shell is cracked.",
      "You are the echo.",
      "The emptiness is yours."
    ];
    let idx = 0;
    function showHollow() {
      document.getElementById('hollow').textContent = hollows[idx];
      idx = (idx + 1) % hollows.length;
      setTimeout(showHollow, 2500 + Math.random()*1500);
    }
    showHollow();
    // Add random font size and color to poem
    const poemEl = document.getElementById('hollowpoem');
    poemEl.style.fontSize = (1.2 + Math.random()*2.2) + 'em';
    poemEl.style.color = ['#fff','#e17055','#ffd369','#fff200'][Math.floor(Math.random()*4)];
    poemEl.style.transform = `rotate(${Math.random()*30-15}deg)`;
    poemEl.style.textShadow = `0 0 8px #ffd369, 0 0 20px #e17055, 0 0 30px #fff200`;
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
