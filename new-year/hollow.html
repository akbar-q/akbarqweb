<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hollow - New Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #222f3e;
      color: #feca57;
      font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
      position: relative;
    }
    .hollow-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.16;
      background: repeating-linear-gradient(120deg, #feca57 0 2px, transparent 2px 40px), repeating-linear-gradient(60deg, #fff2 0 4px, transparent 4px 40px);
      animation: hollowbgmove 10s linear infinite alternate;
    }
    @keyframes hollowbgmove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 60px 60px, 30px 30px; }
    }
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 2.7em;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #feca57;
      text-shadow: 0 2px 24px #fff1, 0 0 2px #fff, 0 0 8px #feca5744;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
      position: relative;
      animation: titlepop 1.7s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate;
    }
    @keyframes titlepop {
      0% { letter-spacing: 0.04em; transform: scale(1) rotate(-1deg); }
      100% { letter-spacing: 0.18em; transform: scale(1.04) rotate(2deg); }
    }
    .subtitle {
      font-size: 1.1em;
      color: #feca57;
      margin-bottom: 1.2em;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      max-width: 60vw;
      opacity: 0.8;
    }
    .intro {
      font-size: 1.05em;
      color: #fffbe6;
      margin-bottom: 2.2em;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      background: rgba(34,47,62,0.7);
      border-radius: 1em;
      padding: 1.2em 2em;
      box-shadow: 0 2px 24px #feca5722;
    }
    .icon-row {
      display: flex;
      gap: 2.2em;
      margin-bottom: 2.5em;
      z-index: 2;
    }
    .icon-row svg {
      width: 2.8em;
      height: 2.8em;
      fill: #feca57;
      opacity: 0.82;
      filter: drop-shadow(0 0 8px #feca5744);
      transition: transform 0.18s, fill 0.18s, opacity 0.18s;
      cursor: pointer;
    }
    .icon-row svg:hover {
      transform: scale(1.18) rotate(-8deg);
      fill: #fff;
      opacity: 1;
    }
    .main-icon {
      position: absolute;
      top: 8vh;
      right: 8vw;
      width: 7em;
      height: 7em;
      opacity: 0.13;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px) drop-shadow(0 0 32px #feca57);
      animation: iconfloat 7s ease-in-out infinite alternate;
    }
    @keyframes iconfloat {
      0% { transform: scale(1) rotate(-8deg) translateY(0); }
      100% { transform: scale(1.08) rotate(12deg) translateY(18px); }
    }
  </style>
  <div class="hollow-bg"></div>
  <div class="main-content">
    <h1>Hollow</h1>
    <div class="subtitle">The new year is hollow</div>
    <div class="intro">
      Promises echo in the void. Resolutions ring empty.<br>
      Hope is a vacant room.<br>
      <span style="color:#feca57;font-weight:bold;">What will you fill it with?</span>
    </div>
    <div class="icon-row">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2v20" stroke="#feca57" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><path d="M2 12h20" stroke="#feca57" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#feca57" stroke-width="2" fill="none"/></svg>
    </div>
  </div>
  <svg class="main-icon" viewBox="0 0 64 64"><ellipse cx="32" cy="32" rx="28" ry="18" fill="#feca57" opacity="0.18"/><ellipse cx="32" cy="32" rx="18" ry="8" stroke="#feca57" stroke-width="4" fill="none"/></svg>
  <script>
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 5000+Math.random()*2000);
  </script>
</head>
<body>
  <h1>Hollow</h1>
  <div class="poem" id="hollowpoem">The new year is hollow.<br>It rings with empty promises.<br>Time is a shell, echoing your hopes.<br>Listen. The emptiness is loud.<br><br>What do you hear?</div>
  <div class="hollow" id="hollow"></div>
  <script>
    const hollows = [
      "Echoes fill the void.",
      "Promises are empty.",
      "The shell is cracked.",
      "You are the echo.",
      "The emptiness is yours."
    ];
    let idx = 0;
    function showHollow() {
      document.getElementById('hollow').textContent = hollows[idx];
      idx = (idx + 1) % hollows.length;
      setTimeout(showHollow, 2500 + Math.random()*1500);
    }
    showHollow();
    // Add random font size and color to poem
    const poemEl = document.getElementById('hollowpoem');
    poemEl.style.fontSize = (1.2 + Math.random()*2.2) + 'em';
    poemEl.style.color = ['#fff','#e17055','#ffd369','#fff200'][Math.floor(Math.random()*4)];
    poemEl.style.transform = `rotate(${Math.random()*30-15}deg)`;
    poemEl.style.textShadow = `0 0 8px #ffd369, 0 0 20px #e17055, 0 0 30px #fff200`;
    setTimeout(()=>{
      window.location.href = 'shuffle.html';
    }, 6000+Math.random()*3000);
  </script>
</body>
</html>
