<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Nightmare 2</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bgimg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.95) contrast(1.1) saturate(1.2);
      animation: imgflash 0.18s infinite alternate;
    }
    @keyframes imgflash {
      0% { filter: brightness(0.95) contrast(1.1) saturate(1.2); }
      100% { filter: brightness(1.1) contrast(1.3) saturate(1.5) hue-rotate(10deg); }
    }
  </style>
</head>
<body>
  <img class="bgimg" src="https://preview.redd.it/s6as7oov9m261.jpg?width=1080&crop=smart&auto=webp&s=286a62ea2dd178e0dff1c4d7ce093c3ab87e1645" alt="nightmare image 2">
  <script>
    setTimeout(()=>{ window.location.href = 'shuffle.html'; }, 3500+Math.random()*2000);
  </script>
</body>
</html>
