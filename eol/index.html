<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>END OF LINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@100;200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="void-background">
        <div class="floating-particles"></div>
        
        <div class="main-container">
            <header class="death-header">
                <h1 class="title-text glitch" data-text="END OF LINE">END OF LINE</h1>
                <div class="subtitle breathing">
                    <span class="typewriter">The final countdown has begun...</span>
                </div>
            </header>

            <main class="countdown-container">
                <div class="countdown-wrapper breathing-slow">
                    <div class="countdown-display">
                        <div class="time-unit">
                            <span class="time-number" id="days">00</span>
                            <span class="time-label">DAYS</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">:</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="hours">00</span>
                            <span class="time-label">HOURS</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">:</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="minutes">00</span>
                            <span class="time-label">MINUTES</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">:</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="seconds">00</span>
                            <span class="time-label">SECONDS</span>
                            <div class="decay-line"></div>
                        </div>
                    </div>
                </div>

                <div class="death-messages">
                    <div class="message-container">
                        <p class="death-quote fade-in-out" id="quote">
                            "In the end, we all return to darkness..."
                        </p>
                    </div>
                </div>
            </main>

            <footer class="ominous-footer">
                <div class="heartbeat-line"></div>
                <p class="final-warning">December 7th, 2025 • 2:00 PM GMT+4</p>
                <div class="skull-decoration">⚰️</div>
            </footer>
        </div>

        <div class="ambient-sounds">
            <!-- Invisible audio elements for atmosphere -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
