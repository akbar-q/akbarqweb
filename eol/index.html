<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07.12.2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=JetBrains+Mono:wght@100;200;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="void-background">
        <div class="floating-particles"></div>
        
        <div class="main-container">
            <header class="main-header">
                <h1 class="title-text" data-text="PROTOCOL SEVEN">PROTOCOL SEVEN</h1>
                <div class="subtitle breathing">
                    <span class="typewriter">initialization sequence commenced</span>
                </div>
            </header>

            <main class="countdown-container">
                <div class="countdown-wrapper breathing-slow">
                    <div class="countdown-display">
                        <div class="time-unit">
                            <span class="time-number" id="days">00</span>
                            <span class="time-label">D</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">.</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="hours">00</span>
                            <span class="time-label">H</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">.</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="minutes">00</span>
                            <span class="time-label">M</span>
                            <div class="decay-line"></div>
                        </div>
                        
                        <div class="separator">
                            <span class="blink">.</span>
                        </div>
                        
                        <div class="time-unit">
                            <span class="time-number" id="seconds">00</span>
                            <span class="time-label">S</span>
                            <div class="decay-line"></div>
                        </div>
                    </div>
                </div>

                <div class="message-area">
                    <div class="message-container">
                        <p class="status-message fade-in-out" id="message">
                            awaiting synchronization...
                        </p>
                    </div>
                </div>
            </main>

            <footer class="status-footer">
                <div class="signal-line"></div>
                <p class="timestamp">07.12.2025 • 14:00 UTC+4</p>
                <div class="status-indicator">●</div>
            </footer>
        </div>

        <div class="ambient-sounds">
            <!-- Invisible audio elements for atmosphere -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
