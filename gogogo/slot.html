<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot Spin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="noise">
  <div class="scanlines"></div>
  <div class="grid">
    <div class="card">
      <h1 class="glitch" data-text="SPIN">SPIN</h1>
      <p>Jackpot or static. Spin until the digits line up.</p>
      <div class="panel">
        <h2 id="reel" data-roll="019101909019">0</h2>
      </div>
      <p class="code-hint">three glyphs decide: 0-1-9</p>
      <div class="btn-row">
        <a class="btn" href="tunnel.html">Spiral down</a>
        <a class="btn" href="maze.html">Spin again</a>
        <a class="btn" href="glitch.html">Break the machine</a>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    slotDance('#reel');
  </script>
</body>
</html>
