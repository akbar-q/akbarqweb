<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whispers</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .whisper-big { font-size: 48px; animation: pulse 1.2s infinite; }
  </style>
</head>
<body class="noise" style="background: radial-gradient(circle, #000000, #1a001a, #2d0033) !important;">
  <div class="scanlines"></div>
  <div class="eye-follow" style="left: 10%; top: 20%;"></div>
  <div class="eye-follow" style="right: 15%; bottom: 25%;"></div>
  <div class="grid">
    <div class="card zoom-horror" style="background: rgba(0,0,0,0.9) !important;">
      <h1 class="glitch" data-text="WHISPER">WHISPER</h1>
      <p class="whisper whisper-big eerie">listen...</p>
      <p class="code-hint" style="font-size: 32px;">expiry number murmurs: ???</p>
      <p class="signature">Akbar Qamar whispers from the void</p>
      <p class="eerie">Can you hear them? The voices? They all say the same three numbers...</p>
      <p style="font-size: 64px; opacity: 0.3; animation: pulse 2s infinite;">???</p>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    whisper(['the code', 'three digits', 'tick tock expiry', 'gift expires soon', 'hidden numbers', 'AKBAR KNOWS', 'the code... soon...']);
    setTimeout(() => { window.location.href = 'quiz-1.html'; }, 12000);
  </script>
</body>
</html>
