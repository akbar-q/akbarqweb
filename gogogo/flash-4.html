<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASH</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      animation: bg-shift 5s infinite, screenshake 0.8s infinite !important;
      background: linear-gradient(180deg, #ff1493, #00bfff, #32cd32, #ff4500) !important;
      background-size: 400% 400% !important;
    }
    .flash-img {
      width: 90%;
      max-width: 600px;
      border: 10px double #ff0;
      box-shadow: 0 0 70px rgba(255,255,0,1);
      animation: floaty 3s infinite, hue 4s linear infinite;
    }
  </style>
</head>
<body class="noise">
  <div class="scanlines"></div>
  <div class="grid">
    <div class="card upside-down">
      <img class="flash-img" src="https://i.imgflip.com/4/30b1gx.jpg" alt="is this a pigeon" />
    </div>
  </div>
  <script>
    const pages = ['image-4.html', 'image-6.html', 'quiz-2.html', 'quiz-6.html'];
    setTimeout(() => {
      window.location.href = pages[Math.floor(Math.random() * pages.length)];
    }, 2100);
  </script>
</body>
</html>
