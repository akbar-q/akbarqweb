<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASH</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      animation: rainbow 3s linear infinite !important;
      background: repeating-linear-gradient(45deg, #ff0000, #ff7700 10%, #ffff00 20%, #00ff00 30%, #0000ff 40%, #8800ff 50%, #ff0000 60%) !important;
      background-size: 500% 500% !important;
    }
    .flash-img {
      width: 90%;
      max-width: 600px;
      border: 5px groove #0f0;
      box-shadow: 0 0 80px rgba(0,255,0,1);
      animation: zoom-pulse 2s infinite, spin 5s linear infinite;
    }
  </style>
</head>
<body class="noise static-overlay">
  <div class="scanlines"></div>
  <div class="grid">
    <div class="card sideways">
      <img class="flash-img" src="https://i.imgflip.com/4/1otk96.jpg" alt="laughing leo" />
    </div>
  </div>
  <script>
    const pages = ['image-7.html', 'image-8.html', 'quiz-4.html', 'wait-2.html'];
    setTimeout(() => {
      window.location.href = pages[Math.floor(Math.random() * pages.length)];
    }, 1900);
  </script>
</body>
</html>
