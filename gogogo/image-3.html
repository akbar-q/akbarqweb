<!DOCTYPE html>
<html lang="en" class="matrix">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATRIX</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .rain span { position: absolute; top: -50px; font-size: 20px; color: #0f0; animation: fall linear infinite; }
    @keyframes fall { to { top: 110%; } }
  </style>
</head>
<body class="noise">
  <div class="rain" id="matrix-rain"></div>
  <div class="scanlines"></div>
  <div class="grid" style="z-index: 10; position: relative;">
    <div class="card">
      <h1 class="glitch" data-text="BREACH">BREACH</h1>
      <p style="color: #0f0;">SYSTEM COMPROMISED. AKBAR QAMAR ACCESSED CORE.</p>
      <img style="width: 100%; max-width: 400px; filter: brightness(0.7) contrast(1.8) hue-rotate(90deg);" src="https://i.imgflip.com/4/26am.jpg" alt="morpheus" />
      <p class="code-hint" style="color: #0f0;">THE CODE IS HIDDEN</p>
      <p style="font-family: 'Courier New'; font-size: 12px; color: #0a0;">01001000 01101001 01100100 01100101</p>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    const rain = document.getElementById('matrix-rain');
    for (let i = 0; i < 30; i++) {
      const span = document.createElement('span');
      span.textContent = String.fromCharCode(0x30A0 + Math.random() * 96);
      span.style.left = Math.random() * 100 + '%';
      span.style.animationDuration = (Math.random() * 3 + 2) + 's';
      span.style.animationDelay = Math.random() * 2 + 's';
      rain.appendChild(span);
    }
    setTimeout(() => { window.location.href = 'quiz-6.html'; }, 13000);
  </script>
</body>
</html>
