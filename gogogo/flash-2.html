<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASH</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      animation: spin-wild 4s linear infinite !important;
      background: radial-gradient(circle, #ff00ff, #00ffff, #ffff00, #ff00ff) !important;
      background-size: 200% 200% !important;
    }
    .flash-img {
      width: 90%;
      max-width: 600px;
      border: 6px dashed #0ff;
      box-shadow: 0 0 50px rgba(0,255,255,0.9);
      animation: spin 3s linear infinite;
    }
  </style>
</head>
<body class="noise">
  <div class="scanlines"></div>
  <div class="grid">
    <div class="card rainbow-spin">
      <img class="flash-img" src="https://i.imgflip.com/4/20gw2w.jpg" alt="surprised pikachu" />
    </div>
  </div>
  <script>
    const pages = ['image-1.html', 'image-2.html', 'image-3.html', 'quiz-1.html', 'quiz-3.html'];
    setTimeout(() => {
      window.location.href = pages[Math.floor(Math.random() * pages.length)];
    }, 1800);
  </script>
</body>
</html>
